      <path class="mask" d="M95 246 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
      <path class="ink" d="M74 284 L92 326 M116 284 L98 326" stroke-width="1.2"/>
      <path class="mask" d="M80 361 C88 352 100 352 108 361 C100 368 88 368 80 361 Z M86 362 L102 360" stroke-width="1.3"/>
      <path class="ink" d="M58 470 C56 510 60 550 64 596 M130 470 C132 510 128 550 124 596 M96 480 V592" stroke-width="1.4"/>
      <path class="mask" d="M50 598 C58 590 80 590 90 598 L90 606 H50 Z M104 596 C112 588 134 588 142 596 L142 604 H104 Z" stroke-width="1.3"/>

      <path class="mask" d="M186 318 C186 282 274 282 274 318 L280 370 H180 Z" stroke-width="1.8"/>
      <path class="mask" d="M230 254 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
