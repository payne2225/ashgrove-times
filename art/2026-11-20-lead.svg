    <!-- THE PODIUM. A curved white top like a lens, a body that waists in
         below it, and the square panel set into the front. -->
    <path class="mask" d="M176 372 C300 326 900 326 1024 372 C900 412 300 412 176 372 Z" stroke-width="2.6"/>
    <path class="mask" d="M176 372 C248 426 268 500 236 604 L964 604 C932 500 952 426 1024 372 C900 412 300 412 176 372 Z" stroke-width="2.4"/>
    <path class="ink faint" d="M230 400 C280 440 290 520 268 596 M970 400 C920 440 910 520 932 596" stroke-width="1"/>
    <path class="ink faint" d="M300 384 C400 398 800 398 900 384" stroke-width="1"/>

    <!-- The exchange's mark and name on the podium front, outlined. -->
    <path class="ink" d="M412 376 L432 376 L448 410 L428 410 Z M424 400 L440 400" stroke-width="1.5"/>
    <text class="word" x="462" y="408" font-size="38">Nasdaq</text>

    <!-- The ticker panel, slightly rounded, set low in the front. -->
    <path class="mask" d="M448 436 C448 428 456 424 464 424 H576 C584 424 592 428 592 436 V560 C592 570 582 576 572 576 H468 C458 576 448 570 448 560 Z" stroke-width="2.2"/>
    <path class="ink faint" d="M458 436 V560 M582 436 V560" stroke-width="1"/>
    <text class="word" x="520" y="500" text-anchor="middle" font-size="40" letter-spacing="4">ANT</text>
    <text class="word" x="520" y="534" text-anchor="middle" font-size="17" letter-spacing="1" stroke-width="0.8">Nasdaq Listed</text>
  </g>
</svg>
