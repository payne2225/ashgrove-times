      <path class="mask" d="M735 226 m-15 0 a15 19 0 1 0 30 0 a15 19 0 1 0 -30 0" stroke-width="1.5"/>
      <path class="ink" d="M721 258 L735 286 L749 258" stroke-width="1.1"/>

      <path class="mask" d="M826 280 C826 252 894 252 894 280 L898 352 H822 Z" stroke-width="1.5"/>
      <path class="mask" d="M860 228 m-15 0 a15 19 0 1 0 30 0 a15 19 0 1 0 -30 0" stroke-width="1.5"/>
      <path class="ink" d="M846 260 L860 288 L874 260" stroke-width="1.1"/>

