      <path class="mask" d="M500 224 m-15 0 a15 19 0 1 0 30 0 a15 19 0 1 0 -30 0" stroke-width="1.5"/>
      <path class="ink" d="M486 256 L500 284 L514 256" stroke-width="1.1"/>

      <path class="mask" d="M576 276 C576 248 644 248 644 276 L648 352 H572 Z" stroke-width="1.5"/>
      <path class="mask" d="M610 224 m-15 0 a15 19 0 1 0 30 0 a15 19 0 1 0 -30 0" stroke-width="1.5"/>
