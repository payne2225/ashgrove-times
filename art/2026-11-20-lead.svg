      <path class="ink" d="M429 294 L447 336 M471 294 L453 336" stroke-width="1.2"/>
      <path class="mask" d="M435 355 C443 346 455 346 463 355 C455 362 443 362 435 355 Z M441 356 L457 354" stroke-width="1.3"/>

      <!-- Center, directly behind the podium. -->
      <path class="mask" d="M511 310 C511 272 601 272 601 310 L608 370 H504 Z" stroke-width="1.8"/>
      <path class="mask" d="M556 244 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
      <path class="ink" d="M534 282 L553 326 M578 282 L559 326" stroke-width="1.2"/>
      <path class="mask" d="M541 345 C549 336 561 336 569 345 C561 352 549 352 541 345 Z M547 346 L563 344" stroke-width="1.3"/>

      <path class="mask" d="M622 316 C622 280 710 280 710 316 L716 370 H616 Z" stroke-width="1.8"/>
      <path class="mask" d="M666 252 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
      <path class="ink" d="M645 290 L663 332 M687 290 L669 332" stroke-width="1.2"/>
      <path class="mask" d="M651 351 C659 342 671 342 679 351 C671 358 659 358 651 351 Z M657 352 L673 350" stroke-width="1.3"/>

      <path class="mask" d="M746 318 C746 282 834 282 834 318 L840 370 H740 Z" stroke-width="1.8"/>
      <path class="mask" d="M790 254 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
      <path class="ink" d="M769 292 L787 334 M811 292 L793 334" stroke-width="1.2"/>
      <path class="mask" d="M775 353 C783 344 795 344 803 353 C795 360 783 360 775 353 Z M781 354 L797 352" stroke-width="1.3"/>

      <path class="mask" d="M866 312 C866 276 954 276 954 312 L960 370 H860 Z" stroke-width="1.8"/>
      <path class="mask" d="M910 248 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
      <path class="ink" d="M889 286 L907 328 M931 286 L913 328" stroke-width="1.2"/>
      <path class="mask" d="M895 347 C903 338 915 338 923 347 C915 354 903 354 895 347 Z M901 348 L917 346" stroke-width="1.3"/>

      <!-- Far right, full figure, the tallest on the stage. -->
      <path class="mask" d="M1002 296 C1002 258 1092 258 1092 296 L1100 464 H994 Z" stroke-width="1.8"/>
      <path class="mask" d="M1047 230 m-19 0 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0" stroke-width="1.8"/>
      <path class="ink" d="M1026 270 L1044 312 M1068 270 L1050 312" stroke-width="1.2"/>
