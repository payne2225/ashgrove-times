      <path d="M0 470 C30 462 60 468 90 464 M1110 150 C1140 142 1170 148 1200 144 M560 480 C600 472 640 478 680 474"/>
    </g>

    <!-- The wordmark across the top of the screen, outlined, not filled. -->
    <text class="word" x="600" y="92" text-anchor="middle" font-size="96" letter-spacing="14">ANTHROPIC</text>

    <!-- THE FLOOR. Wood planks run toward a point behind the podium; the
         seams converge and the boards narrow, which is the depth. -->
    <g class="ink faint" stroke-width="1">
      <path d="M0 660 L120 540 M150 660 L240 540 M300 660 L360 540 M450 660 L480 540 M600 660 V540 M750 660 L720 540 M900 660 L840 540 M1050 660 L960 540 M1200 660 L1080 540"/>
