<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"
     aria-label="Sketch: the Nasdaq MarketSite stage in New York on Thursday. A line of standing figures applauds behind a curved white podium carrying a panel marked ANT, beneath a wall-sized screen that reads ANTHROPIC over a sky of clouds.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor;
               stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.3; }
      .mid   { opacity: 0.58; }
      .word  { fill: none; stroke: currentColor; stroke-width: 1.6; font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <g>
    <!-- THE SCREEN. One wall of light behind everything; its lower edge is the stage floor. -->
    <path class="ink mid" d="M0 540 H1200" stroke-width="1.6"/>
    <path class="ink faint" d="M0 8 H1200" stroke-width="1.2"/>

    <!-- Clouds on the screen, drawn as soft loops that get smaller toward the sides. -->
    <g class="ink faint" stroke-width="1">
      <path d="M60 300 C40 300 36 272 62 266 C64 244 100 238 112 256 C134 246 160 262 148 284 C168 290 160 312 136 310 Z"/>
