      <path d="M60 580 H110 M520 612 H580 M700 648 H760 M1000 572 H1060 M300 556 H340 M860 622 H920"/>
    </g>

    <!-- BACK ROW. Eight figures, heads smaller and higher; the front row
         will stand in front of them. Blank heads, no features. -->
    <g>
      <path class="mask" d="M126 282 C126 254 194 254 194 282 L198 352 H122 Z" stroke-width="1.5"/>
      <path class="mask" d="M160 230 m-15 0 a15 19 0 1 0 30 0 a15 19 0 1 0 -30 0" stroke-width="1.5"/>
      <path class="ink" d="M146 262 L160 290 L174 262" stroke-width="1.1"/>

      <path class="mask" d="M241 280 C241 252 309 252 309 280 L313 352 H237 Z" stroke-width="1.5"/>
