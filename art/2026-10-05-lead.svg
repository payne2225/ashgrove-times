<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img"
     aria-label="Sketch: a supporter in a Brazil football jersey, drawn as an outline with no facial detail, holds up a smartphone whose screen reads Flavio 22 in one hand and a heart-shaped campaign fan marked 22 in the other, inside a bar in Brazil on election night, drawn after a photograph published by Euronews. Behind her are wooden posts, a poster on the wall, two pendant lamps and seated patrons drawn as simple shapes.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.3; }
      .mid   { opacity: 0.55; }
      .txt   { fill: currentColor; stroke: none; font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>
  <g>
    <!-- A supporter holds up a phone reading Flavio 22 and a heart-shaped fan on election night, drawn after a Euronews photograph. -->

    <!-- background: wooden posts, wall, poster -->
    <path class="ink faint" stroke-width="1.2" d="M60 20v540"/>
    <path class="ink faint" stroke-width="1.2" d="M96 20v540"/>
    <path class="ink faint" stroke-width="0.8" d="M78 40v500"/>
    <path class="ink faint" stroke-width="1.2" d="M330 20v420"/>
    <path class="ink faint" stroke-width="1.2" d="M362 20v420"/>
    <path class="ink faint" stroke-width="0.8" d="M346 60v360"/>
    <path class="ink faint" stroke-width="1.0" d="M20 150h40"/>
    <path class="ink faint" stroke-width="1.0" d="M20 300h40"/>
    <!-- poster on the wall between posts -->
    <path class="ink faint" stroke-width="1.0" d="M126 60h190v300H126z"/>
    <path class="ink faint" stroke-width="0.7" d="M140 76h162v110H140z"/>
    <path class="ink faint" stroke-width="0.7" d="M140 200h162v8H140z M140 222h120 M140 240h150 M140 258h100 M140 276h140 M140 294h90"/>
    <!-- television at upper left -->
    <path class="ink faint" stroke-width="1.0" d="M0 90h40v110H0"/>
    <path class="ink faint" stroke-width="0.6" d="M6 100h30v90H6z"/>
    <!-- pendant lamps at upper right -->
    <path class="ink faint" stroke-width="0.9" d="M790 20v38"/>
    <path class="ink faint" stroke-width="0.9" d="M870 20v30"/>
    <circle class="ink faint" cx="790" cy="68" r="12" stroke-width="0.9"/>
    <circle class="ink faint" cx="870" cy="60" r="10" stroke-width="0.9"/>
    <path class="ink faint" stroke-width="0.6" d="M774 82c6 6 26 6 32 0 M858 72c5 5 19 5 24 0"/>
    <!-- wall shelf line and tiles at far right -->
    <path class="ink faint" stroke-width="0.8" d="M700 300h200"/>
    <path class="ink faint" stroke-width="0.6" d="M840 330l30 30-30 30-30-30z M870 390l30 30-30 30-30-30z"/>

    <!-- seated patrons at lower left, as simple shapes -->
    <path class="ink faint" stroke-width="1.0" d="M110 560c0 0 10 -30 40 -30s40 30 40 30"/>
    <path class="ink faint" stroke-width="1.0" d="M130 500c-4-28 10-44 30-44s34 16 30 44c-6 14-54 14-60 0z"/>
    <path class="ink faint" stroke-width="1.0" d="M96 560c6-40 26-60 56-60s50 20 56 60"/>
    <path class="ink faint" stroke-width="0.9" d="M240 560c4-24 14-38 30-38s26 14 30 38"/>
    <path class="ink faint" stroke-width="0.9" d="M258 522c-3-18 6-30 16-30s19 12 16 30c-4 8-28 8-32 0z"/>
    <path class="ink faint" stroke-width="0.8" d="M190 548h50v12h-50z"/>
    <path class="ink faint" stroke-width="0.7" d="M196 548c4-6 10-9 20-9s16 3 20 9"/>

    <!-- the supporter: shoulders and jersey, no facial detail -->
    <path class="ink" stroke-width="1.8" d="M420 560c10-90 60-150 150-170l60-10l70 8c110 20 170 80 190 172"/>
    <!-- jersey collar -->
    <path class="ink" stroke-width="1.4" d="M560 392c20 30 50 46 86 46s66-16 86-46"/>
    <path class="ink mid" stroke-width="1.0" d="M572 380c18 26 42 40 74 40s56-14 74-40"/>
    <!-- jersey green trim at the sleeves -->
    <path class="ink mid" stroke-width="1.0" d="M450 470c20-4 40 0 56 14 M820 456c14-10 34-14 56-10"/>
    <path class="ink mid" stroke-width="0.9" d="M444 486c20-4 42 0 58 14"/>
    <!-- head: outline only, hair pulled back, no features -->
    <path class="ink" stroke-width="1.8" d="M560 250c0-70 42-120 100-120s100 50 100 120c0 50-30 110-100 110s-100-60-100-110z"/>
    <!-- hairline and pulled-back hair, a few strands over the shoulder -->
    <path class="ink" stroke-width="1.4" d="M562 236c10-60 46-96 98-96s88 36 98 96"/>
    <path class="ink mid" stroke-width="1.0" d="M580 170c20-26 48-38 80-38s60 12 80 38"/>
    <path class="ink mid" stroke-width="1.0" d="M600 150c16-14 36-22 60-22s44 8 60 22"/>
    <path class="ink mid" stroke-width="1.0" d="M746 200c8 40 6 90-4 130"/>
    <path class="ink mid" stroke-width="1.0" d="M760 220c8 50 10 110 2 160"/>
    <path class="ink mid" stroke-width="0.9" d="M770 260c6 50 8 100 4 150"/>
    <!-- ear and earring on the right side -->
    <path class="ink mid" stroke-width="1.0" d="M758 250c10-4 16 6 12 18s-14 14-16 4"/>
    <circle class="ink mid" cx="766" cy="282" r="3" stroke-width="0.9"/>
    <!-- neck -->
    <path class="ink" stroke-width="1.4" d="M610 352c6 20 10 32 10 40 M710 352c-6 20-10 32-10 40"/>

    <!-- left arm raised, holding the phone -->
    <path class="ink" stroke-width="1.6" d="M470 560c-10-60 0-120 24-170"/>
    <path class="ink" stroke-width="1.6" d="M540 560c-6-40-4-80 10-120"/>
    <!-- forearm up to the phone -->
    <path class="ink" stroke-width="1.6" d="M494 390c6-30 14-56 30-72"/>
    <path class="ink" stroke-width="1.6" d="M550 440c-4-30 2-70 16-100"/>
    <!-- small tattoo on the forearm, as a leaf shape -->
    <path class="ink mid" stroke-width="0.9" d="M516 430c8-10 20-10 24 2s-4 20-14 20-14-12-10-22z"/>
    <path class="ink mid" stroke-width="0.7" d="M522 448c4-8 8-12 14-16"/>
    <!-- the phone, landscape -->
    <path class="ink" stroke-width="1.8" d="M410 260c0-6 4-10 10-10h186c6 0 10 4 10 10v96c0 6-4 10-10 10H420c-6 0-10-4-10-10z"/>
    <path class="ink mid" stroke-width="1.0" d="M418 258h190v100H418z"/>
    <!-- screen: faint dot-grid, text, light bar beneath -->
    <path class="ink faint" stroke-width="0.5" d="M424 266h178 M424 274h178 M424 282h178 M424 290h178 M424 298h178 M424 334h178 M424 342h178 M424 350h178"/>
    <text class="txt" x="513" y="320" font-size="34" font-weight="bold" text-anchor="middle">Flavio 22</text>
    <path class="ink mid" stroke-width="2.4" d="M428 336h170"/>
    <!-- fingers over the top edge of the phone and thumb below -->
    <path class="ink" stroke-width="1.4" d="M470 252c-4-14 2-26 12-26s14 12 10 26"/>
    <path class="ink" stroke-width="1.4" d="M496 252c-4-16 2-28 12-28s14 12 10 28"/>
    <path class="ink" stroke-width="1.4" d="M522 252c-2-14 4-24 12-24s12 10 10 24"/>
    <path class="ink" stroke-width="1.4" d="M548 254c0-10 6-18 14-18s12 8 10 18"/>
    <path class="ink" stroke-width="1.4" d="M560 366c10 8 22 14 36 12s20-10 16-18"/>
    <path class="ink" stroke-width="1.2" d="M504 366c-10 10-14 24-10 36"/>

    <!-- right arm, holding the heart fan -->
    <path class="ink" stroke-width="1.6" d="M850 560c-6-40-14-80-30-110"/>
    <path class="ink" stroke-width="1.6" d="M790 560c-2-30-6-60-10-80"/>
    <path class="ink" stroke-width="1.6" d="M788 456c-6-20-10-40-14-60"/>
    <path class="ink" stroke-width="1.6" d="M824 450c-8-20-14-40-18-60"/>
    <!-- the heart-shaped fan over the lower face -->
    <path class="ink" stroke-width="1.8" d="M732 420c-40-30-90-70-90-120c0-30 22-50 48-50c20 0 34 12 42 28c8-16 22-28 42-28c26 0 48 20 48 50c0 50-50 90-90 120z"/>
    <!-- the fan's two panels: a blank photo panel at left and a numbered panel at right -->
    <path class="ink mid" stroke-width="1.0" d="M732 278v126"/>
    <path class="ink faint" stroke-width="0.8" d="M680 290h44v90h-44z"/>
    <text class="txt" x="782" y="356" font-size="40" font-weight="bold" text-anchor="middle">22</text>
    <path class="ink mid" stroke-width="0.9" d="M746 302h70"/>
    <path class="ink faint" stroke-width="0.7" d="M750 312h60 M752 320h50"/>
    <!-- ribbons tied at the top of each lobe -->
    <path class="ink mid" stroke-width="1.0" d="M690 250c-6-8-4-18 4-18s12 10 6 18c-6-6-10-6-10 0z M774 250c-6-8-4-18 4-18s12 10 6 18c-6-6-10-6-10 0z"/>
    <!-- fingers holding the fan's point -->
    <path class="ink" stroke-width="1.4" d="M716 420c-6 10-4 22 4 26s14-4 12-14"/>
    <path class="ink" stroke-width="1.4" d="M740 426c-4 10 0 22 8 24s14-6 10-16"/>
    <path class="ink" stroke-width="1.4" d="M764 430c-2 10 2 20 10 22s12-8 8-18"/>
  </g>
</svg>
