<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pen-and-ink drawing after a CBS News photograph: a marble corridor of the U.S. Capitol, a tall arched doorway at left with a chandelier hanging inside it and a dark brass nameplate for the Speaker of the House above the arch, fluted pilasters and a cornice at right, and a man in a suit seen from behind, carrying a folio, walking toward the arch">
