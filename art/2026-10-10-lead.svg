    <path d="M700 224 C688 232 676 246 672 262"/>
    <path d="M760 212 C748 224 738 240 734 258"/>
    <path d="M820 220 C806 230 796 246 792 262"/>
    <path d="M660 250 C650 254 644 262 642 270"/>
  </g>

