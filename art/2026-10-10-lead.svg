    <!-- floor bands -->
    <path d="M690 336 H900"/>
    <path d="M690 380 H900"/>
    <!-- arched openings on the porch wing at right -->
    <path d="M800 336 V300 C800 288 816 288 816 300 V336"/>
    <path d="M830 336 V300 C830 288 846 288 846 300 V336"/>
    <path d="M860 336 V300 C860 288 876 288 876 300 V336"/>
