    <path d="M400 190 L380 280"/>
    <path d="M540 150 L520 250"/>
    <path d="M700 90 L682 170"/>
    <path d="M820 30 L800 120"/>
  </g>

  <!-- Mist band low over the water, a wash and nothing more -->
  <path class="tint" d="M0 262 H900 V300 H0 Z"/>

  <!-- A box-shaped structure, a pier end, far out in the mist at left -->
  <g class="ink faint" stroke-width="1.2">
    <path d="M196 254 H230 V282 H196 Z"/>
    <path d="M196 262 H230"/>
    <path d="M204 262 V282 M214 262 V282 M224 262 V282"/>
  </g>

  <!-- Trees behind the house, canopy lumps all streaming left -->
  <path class="mask" d="M640 262 C650 232 672 218 700 224 C712 204 742 198 760 212 C778 196 808 200 820 220 C840 212 866 222 870 244 C880 252 876 266 866 272 L640 272 Z" stroke-width="1.8"/>
