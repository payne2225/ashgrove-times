<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: a Pensacola waterfront house during Hurricane Isaias, seen across choppy water from a grassy bank. A straight concrete seawall runs in from the right and ends in a pile of riprap, a single palm on the lawn bends hard to the left, a cluster of taller trees leans the same way behind the house, a smaller beach house sits dim in the rain, a box-shaped structure floats in the mist at left, and sea oats on the near bank blow the other way, drawn after an AFP photograph on Al Jazeera.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .tint  { fill: currentColor; opacity: 0.07; stroke: none; }
      .tint2 { fill: currentColor; opacity: 0.16; stroke: none; }
      .tint3 { fill: currentColor; opacity: 0.3; stroke: none; }
      .faint { opacity: 0.3; }
      .mid   { opacity: 0.58; }
    </style>
  </defs>

  <!-- Rain: long slanted strokes, sparse, no horizon line at all. -->
  <g class="ink faint" stroke-width="0.8">
    <path d="M60 20 L30 150"/>
    <path d="M190 10 L160 120"/>
    <path d="M330 40 L300 170"/>
    <path d="M470 15 L440 140"/>
    <path d="M600 60 L575 160"/>
    <path d="M120 120 L95 230"/>
