  <g class="mask" stroke-width="1.4">
    <path d="M60 320 C72 312 88 312 100 320 Z"/>
    <path d="M250 318 C262 310 278 310 290 318 Z"/>
    <path d="M120 342 C134 334 152 334 166 342 Z"/>
    <path d="M300 340 C314 332 332 332 346 340 Z"/>
    <path d="M40 368 C56 358 76 358 92 368 Z"/>
