  <path class="tint2" d="M690 272 H900 V420 H690 Z"/>
  <g class="ink" stroke-width="2">
    <!-- roof -->
    <path d="M668 288 L742 254 L900 246"/>
    <path d="M668 288 L686 290 L900 282"/>
