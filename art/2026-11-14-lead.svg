<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Three airliners parked nose-left at their gates at Miami International Airport, drawn as line work: the nearest fills the foreground with its tail fin, wing and underslung engine, two more sit staggered behind it, jet bridges run from the low terminal block at left to each nose, a fourth aircraft taxis on the far apron, and a hazy skyline with two tower cranes closes the top of the frame. No people are drawn.">
