<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sketch after a photograph of a Swedish polling station in a school gymnasium on election Sunday: two white cardboard voting booths on folding tables, the left one lettered VALSEDLAR with a hand-drawn 1B, a wall of vertical wooden climbing bars behind them hung with a net, and a voter drawn as a plain contour with no facial detail walking between the booths with ballot papers in hand">
  <defs>
    <style>
      path, text { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      text { stroke: none; fill: currentColor; font-family: Helvetica, Arial, sans-serif; }
      .faint { opacity: 0.18; }
      .soft { opacity: 0.32; }
      .mid { opacity: 0.55; }
      .ink { opacity: 0.88; }
    </style>
  </defs>
  <g>
    <!-- the wall of wooden slats: vertical lines, slightly uneven spacing, top of frame to the floor line -->
    <path class="faint" stroke-width="0.8" d="M330,0 V395 M338,0 V395 M347,0 V395 M355,0 V395 M364,0 V395 M372,0 V395 M381,0 V395 M389,0 V395 M398,0 V395 M406,0 V395 M415,0 V395 M423,0 V395 M432,0 V395 M440,0 V395 M449,0 V395 M457,0 V395 M466,0 V395 M474,0 V395 M483,0 V395 M491,0 V395 M500,0 V395 M508,0 V395 M517,0 V395 M525,0 V395 M534,0 V395 M542,0 V395 M551,0 V395 M559,0 V395 M568,0 V395 M576,0 V395 M585,0 V395 M593,0 V395 M602,0 V395 M610,0 V395 M619,0 V395 M627,0 V395 M636,0 V395 M644,0 V395 M653,0 V395 M661,0 V395 M670,0 V395 M678,0 V395 M687,0 V395 M695,0 V395 M704,0 V395"/>
    <path class="faint" stroke-width="0.8" d="M4,0 V18 M13,0 V18 M22,0 V18 M30,0 V18 M39,0 V18 M47,0 V18 M56,0 V18 M64,0 V18 M73,0 V18 M81,0 V18 M90,0 V18 M98,0 V18 M107,0 V18 M115,0 V18 M124,0 V18 M132,0 V18 M141,0 V18 M149,0 V18 M158,0 V18 M166,0 V18 M175,0 V18 M183,0 V18 M192,0 V18 M200,0 V18 M209,0 V18 M217,0 V18 M226,0 V18 M234,0 V18 M243,0 V18 M251,0 V18 M260,0 V18 M268,0 V18 M277,0 V18 M285,0 V18 M294,0 V18 M302,0 V18 M311,0 V18 M319,0 V18"/>
    <path class="faint" stroke-width="0.8" d="M712,0 V18 M721,0 V18 M729,0 V18 M738,0 V18 M746,0 V18 M755,0 V18 M763,0 V18 M772,0 V18 M780,0 V18 M789,0 V18 M797,0 V18"/>
    <!-- the horizontal rails that hold the slats -->
    <path class="soft" stroke-width="1.0" d="M328,12 H706 M328,150 H706 M328,290 H706"/>
    <path class="soft" stroke-width="1.0" d="M0,12 H326 M0,150 H326 M0,290 H326 M708,12 H800 M708,150 H800 M708,290 H800"/>
    <!-- the net: a loose diagonal mesh over the lower two-thirds of the wall -->
    <path class="faint" stroke-width="0.6" d="M330,120 L640,395 M330,160 L600,395 M330,200 L560,395 M330,240 L520,395 M330,280 L480,395 M330,320 L440,395 M370,120 L680,395 M410,120 L706,380 M450,120 L706,345 M490,120 L706,310 M530,120 L706,275 M570,120 L706,240 M610,120 L706,205 M650,120 L706,170"/>
    <path class="faint" stroke-width="0.6" d="M706,120 L400,395 M706,160 L440,395 M706,200 L480,395 M706,240 L520,395 M706,280 L560,395 M706,320 L600,395 M666,120 L360,395 M626,120 L330,378 M586,120 L330,343 M546,120 L330,308 M506,120 L330,273 M466,120 L330,238 M426,120 L330,203 M386,120 L330,168"/>
    <path class="faint" stroke-width="0.7" d="M330,118 C420,112 520,124 706,116"/>
    <!-- floor line and the dark floor band -->
    <path class="mid" stroke-width="1.2" d="M0,396 H800"/>
    <path class="faint" stroke-width="0.7" d="M0,420 H800 M0,446 H800 M0,472 H800"/>

    <!-- LEFT BOOTH: a white cardboard box on a folding table, seen a little from the left -->
    <path class="ink" stroke-width="1.6" d="M0,22 L300,22 L326,46 L326,296 L0,296 Z"/>
    <path class="ink" stroke-width="1.2" d="M300,22 L300,272 L326,296"/>
    <path class="soft" stroke-width="0.9" d="M8,30 L292,30"/>
    <path class="ink" stroke-width="1.4" d="M0,296 L326,296 L326,312 L0,312"/>
    <!-- lettering on the front panel -->
    <text x="34" y="164" font-size="30" font-weight="700" letter-spacing="1">VALSEDLAR</text>
    <text x="38" y="190" font-size="14">En väljare i taget, tack!</text>
    <!-- the hand-drawn 1 and B -->
    <path class="ink" stroke-width="2.2" d="M236,52 L248,40 L248,178 M232,180 L266,180"/>
    <path class="mid" stroke-width="1.0" d="M244,48 L245,176 M251,44 L252,176"/>
    <path class="ink" stroke-width="2.0" d="M254,190 L254,228 L268,228 C280,228 280,210 268,209 L254,209 M254,209 L266,209 C277,209 277,191 266,191 L254,191"/>
    <!-- folding table legs under the left booth -->
    <path class="ink" stroke-width="1.5" d="M14,312 L54,396 M60,312 L20,396 M28,352 H46"/>
    <path class="ink" stroke-width="1.5" d="M262,312 L302,396 M308,312 L268,396 M276,352 H294"/>
    <path class="soft" stroke-width="1.0" d="M36,312 V320 M284,312 V320"/>

    <!-- RIGHT BOOTH: cut by the frame edge -->
    <path class="ink" stroke-width="1.6" d="M712,22 L800,22 M712,22 L712,296 L800,296"/>
    <path class="ink" stroke-width="1.4" d="M700,296 L800,296 L800,312 L700,312 L700,296"/>
    <path class="soft" stroke-width="0.9" d="M720,30 L800,30"/>
    <path class="ink" stroke-width="1.5" d="M720,312 L760,396 M766,312 L726,396 M734,352 H752"/>
    <!-- vertical lettering on the right booth's side, suggested as strokes -->
    <path class="mid" stroke-width="1.8" d="M736,150 V262"/>
    <path class="soft" stroke-width="1.2" d="M744,158 V250"/>

    <!-- THE VOTER: a plain contour, walking left to right, no facial detail -->
    <!-- head and hair, an oval; the hair a second curve, no eyes, no mouth -->
    <path class="ink" stroke-width="1.6" d="M452,38 C468,30 484,40 486,58 C488,76 478,92 464,94 C450,96 442,82 442,64 C442,52 446,42 452,38 Z"/>
    <path class="ink" stroke-width="1.3" d="M446,52 C450,36 470,28 484,42 C492,50 490,70 486,80"/>
    <path class="soft" stroke-width="0.9" d="M444,66 C446,60 450,56 456,56"/>
    <!-- neck and collar -->
    <path class="ink" stroke-width="1.3" d="M462,94 L460,108 M474,92 L474,106"/>
    <path class="ink" stroke-width="1.3" d="M452,110 L462,120 L468,110"/>
    <!-- jacket: shoulders, lapels, hem -->
    <path class="ink" stroke-width="1.6" d="M436,116 C448,108 456,108 460,108 L474,106 C484,104 494,108 500,118"/>
    <path class="ink" stroke-width="1.4" d="M460,108 L466,146 L470,180 M474,106 L470,140"/>
    <path class="ink" stroke-width="1.6" d="M436,116 C428,140 424,170 422,200 L426,236 L470,232 L506,228 L508,196 C508,170 506,140 500,118"/>
    <path class="ink" stroke-width="1.2" d="M448,150 L452,232"/>
    <path class="soft" stroke-width="0.9" d="M470,180 L466,230"/>
    <!-- left sleeve (nearer arm) bent, hand holding ballot papers at the waist -->
    <path class="ink" stroke-width="1.5" d="M436,120 C424,150 420,176 430,196 L442,206 C452,210 470,206 486,202"/>
    <path class="ink" stroke-width="1.5" d="M486,202 L488,190 L496,186 L500,194 L494,206 L482,210"/>
    <!-- the black folder in the far hand -->
    <path class="ink" stroke-width="1.8" d="M486,186 L520,182 L526,208 L492,212 Z"/>
    <path class="mid" stroke-width="1.0" d="M490,192 L520,188 M492,198 L522,194 M494,204 L524,200"/>
    <!-- ballot papers, pale, in front of the folder -->
    <path class="ink" stroke-width="1.1" d="M478,196 L490,178 L502,180 L496,200 Z"/>
    <path class="faint" stroke-width="0.8" d="M482,192 L494,182 M484,196 L495,186"/>
    <!-- far sleeve -->
    <path class="ink" stroke-width="1.3" d="M500,118 C510,140 512,166 508,182"/>
    <!-- trousers: wide legs, mid-stride, the near leg forward -->
    <path class="ink" stroke-width="1.6" d="M426,236 C424,290 420,340 416,390 L414,438 L444,440 L452,392 L462,320 L470,232"/>
    <path class="ink" stroke-width="1.6" d="M470,232 L506,228 C512,270 516,320 518,370 L522,438 L492,440 L488,390 L476,320 L470,300"/>
    <path class="soft" stroke-width="0.9" d="M432,250 C430,300 426,350 424,410"/>
    <path class="soft" stroke-width="0.9" d="M508,250 C512,300 516,350 518,410"/>
    <!-- shoes -->
    <path class="ink" stroke-width="1.4" d="M412,438 L444,440 L450,448 L410,448 Z"/>
    <path class="ink" stroke-width="1.4" d="M490,440 L522,438 L530,448 L492,450 Z"/>
    <!-- the figure's shadow on the floor -->
    <path class="faint" stroke-width="1.0" d="M400,452 C440,456 500,456 548,452"/>
  </g>
</svg>
