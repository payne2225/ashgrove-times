<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: a merchant ship seen from directly overhead through an aircraft's targeting camera, its flat stern toward the viewer and a pale wake trailing away across grey water; corner brackets and a small cross mark the sensor frame.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.28; }
      .mid   { opacity: 0.55; }
    </style>
  </defs>

  <!-- Open water: long faint horizontal strokes, denser toward the bottom,
       the grey sea of a thermal image read as paper left mostly empty. -->
  <g class="ink faint" stroke-width="0.9">
    <path d="M20 60 H200 M260 60 H410 M520 70 H700 M740 56 H880"/>
    <path d="M30 130 H170 M700 118 H860 M60 190 H180 M720 196 H840"/>
    <path d="M40 260 H200 M690 250 H880 M20 300 H160 M700 300 H860"/>
    <path d="M30 350 H230 M660 340 H880 M50 390 H250 M640 384 H860"/>
    <path d="M20 430 H260 M620 424 H880 M40 470 H300 M600 466 H870"/>
  </g>

  <!-- THE HULL, from above. The sides run off the top of the frame and
       converge toward a flat transom; the taper is what says "stern". -->
  <path class="mask" d="M272 -10 C268 70 272 150 286 214 C296 258 318 292 356 298
                        L544 298 C582 292 604 258 614 214 C628 150 632 70 628 -10 Z" stroke-width="2.6"/>
  <!-- Transom edge, drawn heavier, with the twin stern notches. -->
  <path class="ink" d="M356 298 H544" stroke-width="3"/>
  <path class="ink mid" d="M366 284 h24 v14 M510 284 h24 v14" stroke-width="1.4"/>
  <!-- Hull shadow along the waterline, port and starboard. -->
  <g class="ink mid" stroke-width="1.2">
    <path d="M276 40 C274 120 282 180 300 222"/>
    <path d="M624 40 C626 120 618 180 600 222"/>
  </g>

  <!-- Deck. A raised house at the top of the frame, hatch covers and a
       row of containers stacked toward the stern. -->
  <g class="ink" stroke-width="1.6">
    <path d="M330 0 V46 H570 V0"/>
    <path d="M352 46 V72 H548 V46"/>
    <rect x="372" y="86" width="156" height="30"/>
    <rect x="380" y="128" width="140" height="26"/>
    <path d="M380 141 H520 M450 128 V154"/>
    <rect x="388" y="166" width="124" height="22"/>
    <path d="M420 166 V188 M452 166 V188 M484 166 V188"/>
    <rect x="394" y="200" width="112" height="20"/>
    <path d="M422 200 V220 M450 200 V220 M478 200 V220"/>
  </g>
  <g class="ink mid" stroke-width="1">
    <path d="M300 96 h30 M300 110 h26 M300 124 h22"/>
    <path d="M570 96 h30 M574 110 h26 M578 124 h22"/>
    <path d="M400 236 h100 M406 250 h88 M412 264 h76"/>
    <circle cx="340" cy="60" r="5"/>
    <circle cx="560" cy="60" r="5"/>
  </g>

  <!-- THE WAKE. Two faint lines diverging from the transom corners and a
       soft turbulent centre band; it is what tells the eye the ship is
       still under way. -->
  <g class="ink mid" stroke-width="1.3">
    <path d="M372 300 C364 340 346 400 318 506"/>
    <path d="M528 300 C536 340 554 400 582 506"/>
  </g>
  <g class="ink faint" stroke-width="1">
    <path d="M430 312 c-6 30 -10 60 -12 90 c-2 34 0 70 4 104"/>
    <path d="M470 312 c6 30 10 60 12 90 c2 34 0 70 -4 104"/>
    <path d="M450 320 c-4 40 -4 80 0 120 c3 28 2 44 0 66"/>
    <path d="M416 360 c10 6 22 8 34 8 c12 0 24 -2 34 -8"/>
    <path d="M410 410 c12 8 26 11 40 11 c14 0 28 -3 40 -11"/>
    <path d="M404 462 c14 9 30 13 46 13 c16 0 32 -4 46 -13"/>
  </g>

  <!-- The sensor frame: four corner brackets and a small cross set on the
       transom, the only sharp marks in a blurred picture. -->
  <g class="ink" stroke-width="1.8">
    <path d="M150 86 h22 M150 86 v18 M750 86 h-22 M750 86 v18"/>
    <path d="M150 420 h22 M150 420 v-18 M750 420 h-22 M750 420 v-18"/>
    <path d="M450 272 v18 M441 281 h18"/>
  </g>
  <g class="ink mid" stroke-width="1">
    <path d="M454 268 l6 -6 M446 268 l-6 -6 M454 294 l6 6 M446 294 l-6 6"/>
  </g>
</svg>
