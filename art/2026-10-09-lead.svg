<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: a low view along a concrete dock at a Mississippi marina before Hurricane Isaias, a dock cleat in the foreground wrapped in a doubled mooring line, a fender hung from a wooden piling, the hull and cabin windows of a moored boat at left and a distant pier at right under a flat sky, drawn after a WLOX photograph.">
  <defs>
    <style>
      .ink  { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .tint { fill: currentColor; opacity: 0.07; stroke: none; }
      .tint2 { fill: currentColor; opacity: 0.14; stroke: none; }
      .tint3 { fill: currentColor; opacity: 0.32; stroke: none; }
      .faint { opacity: 0.35; }
      .mid { opacity: 0.6; }
    </style>
  </defs>

  <!-- Sky: a few long flat strokes, overcast -->
  <g class="ink faint" stroke-width="1">
    <path d="M520 60 Q 640 52 760 58 T 900 54"/>
    <path d="M560 96 Q 700 90 820 98"/>
    <path d="M620 128 Q 740 124 860 130"/>
  </g>

  <!-- Far water and a distant pier at right -->
  <path class="tint" d="M560 262 H900 V300 H560 Z"/>
  <g class="ink mid" stroke-width="1.2">
    <path d="M560 262 H900"/>
    <path d="M600 290 H900"/>
    <path d="M620 276 Q 700 272 760 278 T 900 274"/>
    <path d="M700 238 H900"/>
    <path d="M700 238 V262"/>
    <path d="M745 236 V262"/>
    <path d="M790 234 V262"/>
    <path d="M835 232 V262"/>
    <path d="M880 230 V262"/>
    <path d="M790 206 V234"/>
    <path d="M800 212 L 822 212 L 822 234"/>
    <path d="M860 208 V230"/>
    <path d="M700 238 L 900 226"/>
  </g>

  <!-- Boat hull at left: a long white hull with a dark sheer stripe,
       the cabin and its row of windows above -->
  <path class="tint" d="M0 110 L 120 92 L 300 70 L 470 60 L 520 60 L 520 250 L 0 300 Z"/>
  <g class="ink" stroke-width="2.2">
    <!-- cabin roofline and cabin sides -->
    <path d="M0 88 L 60 76 L 200 48 L 330 30 L 420 34 L 480 58"/>
    <path d="M60 76 L 70 110"/>
    <path d="M200 48 L 210 102"/>
    <path d="M330 30 L 336 96"/>
    <!-- window row along the cabin -->
    <path d="M78 94 L 140 82 L 140 118 L 80 128 Z"/>
    <path d="M152 80 L 212 70 L 214 106 L 154 116 Z"/>
    <path d="M226 66 L 290 56 L 292 94 L 228 102 Z"/>
    <path d="M302 54 L 360 46 L 362 86 L 304 92 Z"/>
    <!-- gunwale and deck edge -->
    <path d="M0 132 L 120 114 L 300 92 L 470 80 L 530 86"/>
    <path d="M0 140 L 130 124 L 310 104 L 480 92"/>
    <!-- sheer stripe: the dark band along the hull -->
    <path d="M0 196 L 160 180 L 330 166 L 470 162 L 540 170"/>
    <path d="M0 212 L 160 196 L 330 182 L 470 178 L 540 186"/>
    <!-- hull bottom at the waterline -->
    <path d="M0 262 L 170 250 L 340 240 L 480 240 L 560 252"/>
  </g>
  <path class="tint3" d="M0 196 L 160 180 L 330 166 L 470 162 L 540 170 L 540 186 L 470 178 L 330 182 L 160 196 L 0 212 Z"/>
  <g class="tint2">
    <path d="M78 94 L 140 82 L 140 118 L 80 128 Z"/>
    <path d="M152 80 L 212 70 L 214 106 L 154 116 Z"/>
    <path d="M226 66 L 290 56 L 292 94 L 228 102 Z"/>
    <path d="M302 54 L 360 46 L 362 86 L 304 92 Z"/>
  </g>
  <!-- rigging and a few stanchions on the boat -->
  <g class="ink mid" stroke-width="1.2">
    <path d="M250 94 L 246 60"/>
    <path d="M400 84 L 398 40"/>
    <path d="M398 40 L 560 10"/>
    <path d="M420 34 L 470 0"/>
    <path d="M440 82 L 438 44"/>
    <path d="M500 86 L 540 30"/>
    <path d="M530 86 L 545 40"/>
    <!-- hull wear streaks -->
    <path d="M40 228 L 42 252"/>
    <path d="M120 222 L 118 246"/>
    <path d="M250 206 L 252 234"/>
    <path d="M380 198 L 382 232"/>
  </g>

  <!-- Water below the hull -->
  <path class="tint" d="M0 262 L 170 250 L 340 240 L 480 240 L 560 252 L 600 290 L 560 300 L 0 330 Z"/>
  <g class="ink faint" stroke-width="1.2">
    <path d="M30 290 Q 90 286 150 290"/>
    <path d="M200 284 Q 260 280 330 284"/>
    <path d="M380 276 Q 440 272 500 278"/>
  </g>

  <!-- The piling at right of center: a tall wooden post, grain lines,
       with a dark fender hung from it on a short line -->
  <path class="tint2" d="M618 20 L 668 20 L 672 410 L 614 410 Z"/>
  <g class="ink" stroke-width="2.4">
    <path d="M618 20 L 614 410"/>
    <path d="M668 20 L 672 410"/>
    <path d="M618 20 Q 643 12 668 20"/>
  </g>
  <g class="ink faint" stroke-width="1.2">
    <path d="M634 40 L 632 400"/>
    <path d="M652 36 L 654 404"/>
    <path d="M640 120 Q 646 140 640 160"/>
    <path d="M626 240 Q 634 260 628 290"/>
  </g>
  <!-- fender line from the piling top down to the fender eye -->
  <g class="ink" stroke-width="1.8">
    <path d="M660 70 Q 630 90 600 150"/>
    <path d="M600 150 L 594 162"/>
  </g>
  <!-- the fender: a dark cylinder with a rounded end, hanging at an angle -->
  <path class="tint3" d="M560 170 Q 580 150 600 160 L 650 300 Q 640 322 616 318 Z"/>
  <g class="ink" stroke-width="2.4">
    <path d="M560 170 Q 580 150 600 160"/>
    <path d="M600 160 L 650 300"/>
    <path d="M560 170 L 616 318"/>
    <path d="M616 318 Q 640 322 650 300"/>
    <path d="M588 162 Q 592 170 596 178"/>
  </g>
  <g class="ink faint" stroke-width="1.2">
    <path d="M578 200 L 622 300"/>
    <path d="M568 186 L 608 284"/>
  </g>

  <!-- The dock: concrete deck filling the foreground, its edge receding
       to the right -->
  <path class="tint" d="M0 330 L 560 300 L 900 326 L 900 506 L 0 506 Z"/>
  <g class="ink" stroke-width="2.2">
    <path d="M0 330 L 560 300 L 900 326"/>
  </g>
  <!-- the concrete's grain: short dashes of aggregate -->
  <g class="ink faint" stroke-width="1" stroke-dasharray="2 9">
    <path d="M20 400 H 420"/>
    <path d="M60 440 H 520"/>
    <path d="M0 480 H 600"/>
    <path d="M700 420 H 900"/>
    <path d="M760 470 H 900"/>
  </g>

  <!-- The cleat: a horned casting bolted to the deck, seen low and close,
       with the mooring line laid in figure eights over both horns -->
  <path class="tint3" d="M440 352 Q 470 336 520 340 L 580 346 Q 630 342 652 360 L 642 378 Q 600 370 560 372 Q 510 376 456 374 Z"/>
  <g class="ink" stroke-width="2.8">
    <path d="M428 396 Q 540 378 668 390 L 666 408 Q 540 396 426 414 Z"/>
    <path d="M440 352 Q 470 336 520 340 L 580 346 Q 630 342 652 360"/>
    <path d="M456 374 Q 510 362 642 378"/>
    <path d="M440 352 L 456 374"/>
    <path d="M652 360 L 642 378"/>
    <path d="M520 340 L 516 378"/>
    <path d="M580 346 L 576 384"/>
    <path d="M516 378 L 512 398"/>
    <path d="M576 384 L 574 402"/>
  </g>
  <!-- bolt heads on the base -->
  <g class="ink mid" stroke-width="2">
    <path d="M446 402 a4 4 0 1 0 0.1 0"/>
    <path d="M648 396 a4 4 0 1 0 0.1 0"/>
  </g>

  <!-- The mooring line: a doubled line running in from the left, laid
       in figure eights over the horns, and a last turn piled on top -->
  <g class="ink" stroke-width="5.5">
    <path d="M0 372 Q 200 364 400 356 Q 440 352 470 356"/>
    <path d="M0 386 Q 200 378 400 370 Q 440 366 470 370"/>
  </g>
  <g class="ink" stroke-width="5">
    <path d="M470 356 Q 500 326 536 334 Q 560 340 556 360 Q 552 380 530 392 Q 500 402 476 392 Q 456 382 470 370"/>
    <path d="M556 360 Q 580 330 616 334 Q 648 340 646 364 Q 642 386 614 396 Q 586 402 566 390"/>
    <path d="M470 370 Q 520 404 566 398 Q 606 392 626 372"/>
    <path d="M500 346 Q 540 316 600 322 Q 640 328 650 352"/>
    <path d="M536 334 Q 512 338 500 346"/>
  </g>
  <!-- flecks along the rope's lay -->
  <g class="ink faint" stroke-width="1.5">
    <path d="M60 370 L 62 376"/>
    <path d="M140 367 L 142 373"/>
    <path d="M220 364 L 222 370"/>
    <path d="M300 361 L 302 367"/>
    <path d="M380 358 L 382 364"/>
    <path d="M100 383 L 102 389"/>
    <path d="M180 380 L 182 386"/>
    <path d="M260 377 L 262 383"/>
    <path d="M340 374 L 342 380"/>
    <path d="M520 332 L 522 338"/>
    <path d="M600 324 L 602 330"/>
    <path d="M620 392 L 624 396"/>
    <path d="M500 398 L 504 402"/>
  </g>

  <!-- the chain and short line from the fender eye, dropped over the
       cleat's near horn -->
  <g class="ink mid" stroke-width="1.6">
    <path d="M594 162 Q 586 190 574 230 Q 566 262 572 300 Q 578 326 600 336"/>
  </g>

  <!-- a second rope running off to the right along the dock edge -->
  <g class="ink mid" stroke-width="3">
    <path d="M646 376 Q 740 368 830 364 Q 870 362 900 366"/>
  </g>
</svg>
