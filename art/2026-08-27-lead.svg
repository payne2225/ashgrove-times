<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img"
     aria-label="View down the flooded Trishuli valley: a braided mud river fills the valley floor, and multi-storey buildings stand isolated in the flood plain with debris banked against their lower floors">
  <!-- All marks stroke in currentColor; line work only, no fills. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Far valley wall, top: wooded slope dropping to the river ===== -->
    <g stroke-width="2">
      <path d="M0 96 C90 74 180 60 300 56 C450 50 600 40 760 22"/>
    </g>
    <g stroke-width="1" opacity="0.75">
      <!-- forest canopy as scalloped runs along the far slope -->
      <path d="M8 88 q14 -12 28 -2 q12 -12 26 -3 q13 -11 27 -2 q12 -10 25 -2"/>
      <path d="M150 72 q13 -11 26 -2 q12 -11 26 -2 q13 -10 26 -2 q12 -10 25 -1"/>
      <path d="M300 60 q13 -11 26 -3 q13 -10 26 -2 q13 -10 26 -2"/>
      <path d="M450 48 q13 -11 26 -3 q13 -10 26 -2 q13 -10 26 -2 q13 -9 25 -2"/>
      <path d="M610 36 q13 -10 26 -3 q13 -10 26 -2 q13 -9 25 -2"/>
      <!-- slope hatching down to the bank -->
      <path d="M40 92 l10 14 M120 80 l9 15 M210 70 l8 15 M330 60 l8 16 M470 48 l7 16 M600 36 l7 16 M700 28 l6 15"/>
    </g>

    <!-- ===== Far-bank town, upper left, stepped up the hillside ===== -->
    <g stroke-width="1.3">
      <path d="M28 118 h30 v-22 h-30 z M36 96 h14 l-7 -8 z"/>
      <path d="M70 112 h26 v-18 h-26 z"/>
      <path d="M104 120 h32 v-26 h-32 z M104 100 l16 -9 16 9"/>
      <path d="M146 112 h24 v-18 h-24 z"/>
      <path d="M180 122 h30 v-22 h-30 z"/>
      <path d="M54 140 h34 v-18 h-34 z"/>
      <path d="M100 146 h28 v-16 h-28 z"/>
      <path d="M140 142 h30 v-18 h-30 z"/>
    </g>
    <g stroke-width="0.9" opacity="0.7">
      <path d="M34 104 h5 M45 104 h5 M76 100 h5 M87 100 h5 M112 108 h6 M124 108 h6 M151 100 h5 M186 108 h6 M198 108 h6 M62 130 h6 M74 130 h6 M106 136 h5 M117 136 h5 M147 132 h6 M159 132 h6"/>
    </g>

    <!-- ===== Near valley wall, right: steep wooded bank into the frame ===== -->
    <g stroke-width="2">
      <path d="M760 120 C700 160 660 220 640 300 C620 380 616 470 628 560"/>
    </g>
    <g stroke-width="1" opacity="0.75">
      <path d="M744 140 q-16 -6 -22 8 q-16 -4 -20 10 q-15 -3 -18 11"/>
      <path d="M700 190 q-15 -5 -20 9 q-15 -3 -18 11 q-14 -2 -16 12"/>
      <path d="M668 260 q-14 -4 -18 10 q-13 -2 -15 12"/>
      <path d="M648 340 q-13 -3 -16 11 q-12 -1 -13 12"/>
      <path d="M636 430 q-12 -2 -14 12 q-11 0 -11 13"/>
      <path d="M700 150 l14 12 M672 220 l13 12 M652 300 l12 12 M640 390 l10 12 M632 480 l9 12"/>
    </g>

    <!-- ===== Braided flood channel sweeping upper-left to lower-left ===== -->
    <g stroke-width="1.6" opacity="0.9">
      <path d="M240 56 C220 120 190 200 150 280 C110 360 60 440 0 500"/>
      <path d="M330 58 C300 140 260 230 210 320 C160 410 90 490 20 560"/>
    </g>
    <g stroke-width="1" opacity="0.6">
      <!-- inner flow streaks -->
      <path d="M268 80 C244 150 212 230 172 310 C136 382 84 456 24 520"/>
      <path d="M296 92 C270 160 236 244 192 330 C150 412 96 486 40 548"/>
      <path d="M254 130 C236 180 214 232 186 288 M226 210 C204 258 178 308 148 358 M180 320 C152 372 118 424 80 476"/>
      <!-- braid bars: lens shapes in the channel -->
      <path d="M236 168 q16 -10 30 0 q-16 12 -30 0 z"/>
      <path d="M196 262 q15 -9 28 0 q-15 11 -28 0 z"/>
      <path d="M142 366 q14 -9 26 0 q-14 11 -26 0 z"/>
      <path d="M88 452 q13 -8 24 0 q-13 10 -24 0 z"/>
    </g>

    <!-- ===== Mud plain: sparse contour streaks where the ground was ===== -->
    <g stroke-width="0.9" opacity="0.5">
      <path d="M340 120 q40 8 84 4 M320 190 q52 10 108 4 M300 270 q60 12 128 6 M280 360 q72 12 152 6 M260 460 q84 14 176 6 M360 540 q70 8 150 2"/>
      <path d="M420 150 q30 6 62 3 M400 230 q38 8 80 4 M390 320 q44 8 94 4 M380 420 q52 10 110 4"/>
    </g>

    <!-- ===== Mid-distance building standing in the mud ===== -->
    <g stroke-width="1.5">
      <path d="M430 172 h44 v-58 h-44 z"/>
      <path d="M430 114 h44 l-6 -8 h-32 z"/>
      <!-- mud banked over the base -->
      <path d="M424 172 q22 -8 56 0" stroke-width="1.1"/>
    </g>
    <g stroke-width="0.9" opacity="0.7">
      <path d="M438 126 h8 M458 126 h8 M438 140 h8 M458 140 h8 M438 154 h8 M458 154 h8"/>
    </g>

    <!-- ===== Second building, closer, taller ===== -->
    <g stroke-width="1.6">
      <path d="M500 300 h62 v-92 h-62 z"/>
      <path d="M500 208 h62 l-7 -10 h-48 z"/>
      <path d="M514 198 h12 v-8 h-12 z"/><!-- rooftop tank -->
      <path d="M492 300 q30 -10 78 0" stroke-width="1.2"/><!-- mud line -->
    </g>
    <g stroke-width="1" opacity="0.7">
      <path d="M510 222 h10 M534 222 h10 M510 240 h10 M534 240 h10 M510 258 h10 M534 258 h10 M510 276 h10 M534 276 h10"/>
    </g>

    <!-- ===== Foreground building, lower left, big and mud-swamped ===== -->
    <g stroke-width="1.8">
      <path d="M120 520 h108 v-96 h-108 z"/>
      <path d="M120 424 h108 l-10 -14 h-88 z"/>
      <path d="M150 410 h20 v-12 h-20 z"/><!-- roof stair head -->
      <path d="M104 520 q54 -14 140 0" stroke-width="1.3"/><!-- debris bank -->
      <path d="M112 534 q58 -10 132 -2" stroke-width="1" opacity="0.7"/>
    </g>
    <g stroke-width="1" opacity="0.7">
      <path d="M136 440 h14 M166 440 h14 M196 440 h14 M136 464 h14 M166 464 h14 M196 464 h14 M136 488 h14 M166 488 h14 M196 488 h14"/>
    </g>

    <!-- ===== Foreground-right building, cut by the frame ===== -->
    <g stroke-width="1.7">
      <path d="M676 560 v-118 h64 v118"/>
      <path d="M676 442 h64 l-8 -12 h-48 z"/>
      <path d="M664 560 q34 -12 84 -4" stroke-width="1.2"/>
    </g>
    <g stroke-width="1" opacity="0.7">
      <path d="M690 458 h12 M714 458 h12 M690 482 h12 M714 482 h12 M690 506 h12 M714 506 h12 M690 530 h12 M714 530 h12"/>
    </g>

    <!-- ===== Lone trees left standing in the mud ===== -->
    <g stroke-width="1.2">
      <path d="M584 380 v-26 q-12 -4 -10 -18 q2 -14 16 -14 q14 0 16 14 q2 14 -10 18 v26"/>
      <path d="M356 250 v-18 q-9 -3 -8 -13 q2 -11 12 -11 q11 0 12 11 q1 10 -8 13 v18"/>
      <path d="M300 480 v-22 q-11 -4 -9 -16 q2 -13 14 -13 q13 0 14 13 q2 12 -9 16 v22"/>
    </g>
  </g>
</svg>
