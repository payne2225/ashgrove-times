    <!-- braided mud flow across the foreground -->
    <path d="M0,470 q120,-16 260,-8 q160,8 340,-6"/>
    <path d="M0,530 q140,-18 300,-8 q180,10 360,-8 q120,-10 300,-4"/>
    <path d="M0,600 q170,-22 360,-10 q200,12 420,-10 q100,-8 180,-4"/>
    <path d="M60,660 q180,-20 380,-8 q220,12 460,-12"/>
    <path d="M120,706 q220,-22 480,-6 q180,8 360,-14"/>
