    <path d="M420,610 l10,-6 12,4 -2,10 -14,2 Z M660,586 l8,-6 12,2 0,10 -12,4 Z M760,640 l10,-8 14,4 -2,12 -16,2 Z M180,624 l8,-6 10,2 0,8 -10,4 Z M520,656 l8,-6 12,2 0,10 -12,4 Z"/>
    <!-- snagged line trailing in the mud -->
    <path d="M700,530 q30,16 24,44 q-4,18 -22,22"/>
  </g>
</svg>
