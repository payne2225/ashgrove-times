    <path d="M216,420 q-10,-18 6,-26 q16,-6 22,8 q4,12 -6,20 M214,424 q-14,10 -14,36 l-4,66 q22,10 44,2 l0,-66 q0,-26 -12,-38"/>
    <path d="M198,528 q20,10 44,2 M206,530 q-2,26 -4,44 M232,530 q2,26 2,44"/>
