    <path d="M80,646 q20,-8 44,-2 q10,4 2,10 q-22,6 -44,0 q-8,-4 -2,-8"/>
    <path d="M300,676 q24,-8 50,-2 q10,4 0,10 q-26,6 -50,0 q-8,-4 0,-8"/>
    <path d="M212,560 q14,-6 30,-2 q8,4 0,8 q-16,4 -30,0 q-6,-4 0,-6"/>
