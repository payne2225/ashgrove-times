    <path d="M136,436 L182,432 M134,456 L182,452"/>
    <path d="M140,508 q-2,34 -6,60 M172,506 q4,32 2,60 M134,568 l-12,10 M174,566 l10,12"/>
    <path d="M148,444 q-14,10 -18,30 l-4,18 M180,440 q14,12 16,34 l2,14"/>
