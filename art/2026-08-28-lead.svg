    <path d="M700,332 L700,258 L820,250 L820,318"/>
    <path d="M690,262 L832,252"/>
    <path d="M712,258 q4,-16 14,-6 q6,-12 14,-2 q8,-10 14,0 M770,254 q6,-14 14,-4 q8,-8 12,2"/>
