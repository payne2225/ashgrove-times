    <path d="M560,402 L820,392"/>
    <!-- open bays, upper storey -->
    <path d="M590,398 L590,344 M640,396 L640,342 M692,392 L692,338 M744,390 L744,334 M796,388 L796,330"/>
    <path d="M590,344 L796,330"/>
