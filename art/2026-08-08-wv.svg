<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: the Williams River at Cowen on a falling gauge, 96 cubic feet per second. A broad cobble bar fills the near bank and pushes a narrow thread of water hard against a low rock bluff on the right, with timbered banks converging under layered Appalachian ridges upstream.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor;
               stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.3; }
      .mid   { opacity: 0.58; }
    </style>
  </defs>

  <g>
    <!-- Far ridge, rounded and layered. The overlap of the two ridges is
         what puts distance behind the water. -->
    <path class="mask" d="M0 188 C96 146 178 130 272 140 C360 149 412 122 494 120
                          C584 118 646 142 730 136 C802 131 856 150 900 172
                          V246 H0 Z" stroke-width="2.2"/>
    <g class="ink faint" stroke-width="0.9">
      <path d="M126 164c26 12 44 28 56 46M312 148c24 12 40 30 50 48M528 130c22 12 38 30 46 50M736 146c22 12 36 28 44 46"/>
    </g>

    <!-- Nearer ridge. -->
    <path class="mask" d="M0 238 C112 202 214 196 306 210 C398 223 458 200 546 198
                          C636 196 704 218 792 212 C846 208 876 218 900 230
                          V282 H0 Z" stroke-width="2.2"/>

    <!-- Timber down to both banks, drawn as canopy lumps rather than trees. -->
    <g>
      <path class="mask" d="M0 282 C38 254 76 250 106 264 C130 246 166 246 188 264
                            C212 248 246 252 262 270 C284 258 310 264 320 280
                            L320 306 H0 Z" stroke-width="2"/>
      <path class="mask" d="M560 280 C582 260 612 258 632 272 C654 254 688 254 708 270
                            C734 252 770 256 788 274 C816 258 856 264 900 278
                            V306 H560 Z" stroke-width="2"/>
    </g>
    <g class="ink faint" stroke-width="0.9">
      <path d="M52 270c4 10 4 18 0 26M146 268c4 10 4 18 0 26M228 274c4 10 4 18 0 26"/>
      <path d="M606 276c4 10 4 18 0 26M694 274c4 10 4 18 0 26M776 278c4 10 4 18 0 26"/>
    </g>

    <!-- Low rock bluff on the right bank: the water is pinned against it
         because there is not enough of it to spread. -->
    <path class="ink" stroke-width="2" d="M900 300 L836 306 L800 322 L778 344 L768 372 L772 404 L900 412"/>
    <g class="ink mid" stroke-width="1.1">
      <path d="M846 312l-30 18M818 330l-26 20M800 356l-22 14M844 340l-40 26M862 366l-52 30"/>
    </g>

    <!-- Banks converging upstream. The convergence is the perspective. -->
    <path class="ink" stroke-width="2.2" d="M318 300 C376 306 424 316 470 330 C516 344 552 358 578 372"/>
    <path class="ink" stroke-width="2.2" d="M562 292 C540 300 520 310 504 320 C486 332 474 344 466 356"/>

    <!-- The wetted channel: a narrow thread held to the right of frame,
         far narrower than the bed it sits in. -->
    <path class="ink" stroke-width="2.4"
          d="M498 330 C520 348 540 368 556 392 C574 420 596 448 626 468 C654 486 690 498 730 506"/>
    <path class="ink" stroke-width="2.4"
          d="M534 326 C560 344 584 366 606 392 C630 420 662 448 700 466 C736 484 782 494 828 500"/>
    <g class="ink mid" stroke-width="1">
      <path d="M528 356c16 14 30 30 42 48M566 380c16 14 30 30 44 46M614 424c20 16 42 30 66 40M676 460c24 12 52 20 82 26"/>
    </g>

    <!-- Broad cobble bar filling the left and near foreground. Stones shrink
         with distance; that gradient is what keeps the bar from reading as
         scattered confetti. -->
    <g class="ink" stroke-width="1.9">
      <path d="M96 470c14-16 44-20 62-6 16 12 12 30-8 36-24 7-52-3-58-16-3-6 0-11 4-14Z"/>
      <path d="M206 494c12-14 40-17 56-5 14 11 10 27-8 32-21 6-46-3-51-14-3-5 0-9 3-13Z"/>
      <path d="M40 420c11-12 34-14 46-4 11 9 8 22-7 26-17 5-38-3-42-11-2-5 0-8 3-11Z"/>
      <path d="M164 424c10-11 30-13 41-4 10 8 7 20-6 24-15 4-34-3-38-10-2-4 0-7 3-10Z"/>
      <path d="M286 440c9-10 27-12 37-4 9 7 6 18-6 22-14 4-31-3-34-9-2-4 0-7 3-9Z"/>
      <path d="M110 372c8-9 24-10 33-3 8 6 5 16-5 19-12 3-27-2-30-8-2-3 0-6 2-8Z"/>
      <path d="M232 372c8-8 22-10 30-3 7 6 5 15-5 18-11 3-25-2-28-7-1-3 0-6 3-8Z"/>
      <path d="M344 390c7-8 21-9 29-3 7 5 4 14-5 17-11 3-24-2-27-7-1-3 0-5 3-7Z"/>
      <path d="M330 336c6-7 18-8 25-3 6 5 4 12-4 14-9 3-21-1-23-6-1-2 0-4 2-5Z"/>
      <path d="M414 356c6-6 17-7 23-2 5 4 3 11-4 13-9 2-20-1-22-6-1-2 0-4 3-5Z"/>
      <path d="M420 316c5-6 15-6 20-2 5 4 3 10-3 11-8 2-18-1-19-5-1-2 0-3 2-4Z"/>
      <path d="M470 300c4-5 13-5 17-2 4 3 2 8-3 10-7 1-15-1-16-4-1-2 0-3 2-4Z"/>
    </g>
    <g class="ink mid" stroke-width="1.1">
      <path d="M112 462c12-8 30-9 42-2M218 488c10-7 26-8 36-2M52 414c9-6 24-7 33-2M174 418c8-5 21-6 29-2M294 434c7-5 19-6 26-2"/>
    </g>

    <!-- Dry side-channel, the seam the bar splits. On a falling gauge it
         holds no water; drawn as a trace, not a stream. -->
    <path class="ink faint" stroke-width="1.4"
          d="M452 322 C420 344 384 368 348 396 C310 426 268 456 222 484"/>

    <!-- A few stones standing out of the wetted thread itself. -->
    <g class="ink" stroke-width="1.5">
      <path d="M596 414c6-6 17-7 23-2 5 4 3 11-4 13-9 2-20-2-22-6-1-2 0-4 3-5Z"/>
      <path d="M668 452c7-6 19-7 25-2 6 5 3 12-5 14-10 2-22-2-24-7-1-2 0-4 4-5Z"/>
      <path d="M556 372c5-5 14-6 19-2 5 4 3 9-3 11-8 2-17-1-18-5-1-2 0-3 2-4Z"/>
    </g>
  </g>
</svg>
