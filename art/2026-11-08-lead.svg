<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pen-and-ink drawing after an Al Jazeera photograph: Krakow's Main Market Square at first light the morning after the shooting, nearly empty, the long arcaded Cloth Hall across the far side with its parapet and turrets, a bare tree and street lamps, a row of tall tenements with arched shopfronts on the right, a city guard car at the kerb, two officers and a woman standing on the cobbles drawn as outlines with no faces, and a police car far off at the left edge of the square.">
