<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: two voters fill out ballots at privacy booths in a school gymnasium. Each booth panel carries a flag and the word VOTE.">
  <!-- Drawn from a news photograph, not traced from it. Foreground shapes
       carry a paper-coloured fill so they occlude what is behind them —
       without that everything shows through everything and the drawing
       reads as a tangle of lines. -->
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .solid { fill: currentColor; stroke: none; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor;
               stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.3; }
    </style>
  </defs>

  <!--  background: wall, suggested in courses  -->
  <g class="ink faint" stroke-width="1">
    <path d="M0 40h900M0 82h900M0 124h900M0 166h900M0 208h900M0 250h900M0 292h900M0 334h900M0 376h900M0 418h900"/>
    <path d="M60 40v42M180 40v42M300 40v42M420 40v42M540 40v42M660 40v42M780 40v42"/>
    <path d="M120 82v42M240 82v42M360 82v42M480 82v42M600 82v42M720 82v42M840 82v42"/>
    <path d="M60 292v42M180 292v42M300 292v42M420 292v42M540 292v42M660 292v42M780 292v42"/>
    <path d="M120 334v42M240 334v42M360 334v42M480 334v42M600 334v42M720 334v42M840 334v42"/>
    <path d="M60 376v42M180 376v42M300 376v42M420 376v42M540 376v42M660 376v42M780 376v42"/>
  </g>

  <!--  trophy case, set BEHIND everything  -->
  <g>
    <path class="mask" d="M470 10h418v150H470z" stroke-width="1.8"/>
    <path class="ink" d="M470 92h418" stroke-width="1.2"/>
    <g class="ink" stroke-width="1.3">
      <path d="M512 78v-9m-10 9h20M502 40h20v16a10 10 0 0 1-20 0zM502 45h-7a6 6 0 0 0 7 7M522 45h7a6 6 0 0 1-7 7"/>
      <path d="M566 78v-9m-10 9h20M556 36h20v20a10 10 0 0 1-20 0z"/>
      <path d="M792 78v-9m-10 9h20M782 42h20v14a10 10 0 0 1-20 0z"/>
      <path d="M844 78v-9m-10 9h20M834 38h20v18a10 10 0 0 1-20 0z"/>
      <path d="M700 146v-9m-10 9h20M690 112h20v16a10 10 0 0 1-20 0z"/>
      <path d="M760 146v-9m-10 9h20M750 108h20v20a10 10 0 0 1-20 0z"/>
      <path d="M818 146v-9m-10 9h20M808 114h20v14a10 10 0 0 1-20 0z"/>
    </g>
    <g class="ink" stroke-width="1.2">
      <path d="M610 24h50v44h-50zM676 20h40v48h-40z"/>
      <path d="M620 36h30M620 46h30M620 56h20" stroke-width="0.8" class="faint"/>
    </g>
    <circle class="mask" cx="748" cy="52" r="19" stroke-width="1.4"/>
    <path class="ink" d="M729 52h38M748 33v38M735 38c9 8 9 20 0 28M761 38c-9 8-9 20 0 28" stroke-width="0.9"/>
  </g>

  <!--  door, left  -->
  <path class="mask" d="M10 8h190v492H10z" stroke-width="2.2"/>
  <path class="ink" d="M44 44h108v82H44z" stroke-width="1.5"/>
  <g class="ink faint" stroke-width="0.9">
    <path d="M44 58h108M44 72h108M44 86h108M44 100h108M44 114h108"/>
  </g>
  <path class="ink faint" d="M26 150v330M184 150v330" stroke-width="1"/>
  <circle class="solid" cx="170" cy="262" r="5"/>

  <!--  LEFT FIGURE: bent to the ballot  -->
  <g>
    <!-- legs first, then torso over them -->
    <path class="mask" d="M240 300h40l8 186h-46z" stroke-width="2"/>
    <path class="mask" d="M290 300h40l6 186h-46z" stroke-width="2"/>
    <path class="mask" d="M228 486h54a6 6 0 0 1 6 6v6h-60z" stroke-width="2"/><path class="mask" d="M282 486h54a6 6 0 0 1 6 6v6h-60z" stroke-width="2"/>
    <!-- torso: bent forward, hi-vis over dark sleeves -->
    <path class="mask" d="M246 176c-10 22-14 56-12 96 1 18 2 26 4 34h96c2-14 0-40-6-62-8-28-22-52-38-64-14-10-34-16-44-4z" stroke-width="2.4"/>
    <g class="ink" stroke-width="1.4">
      <path d="M238 232c30-8 62-6 92 8M236 252c30-8 64-6 94 8"/>
    </g>
    <!-- reaching arm, drawn over the torso, onto the table -->
    <path class="mask" d="M300 196c22 8 42 24 56 44l-16 12c-16-18-34-30-52-36z" stroke-width="2"/>
    <!-- head: bowed, no facial detail -->
    <path class="mask" d="M262 130a30 30 0 0 1 52 22c0 14-10 26-24 28-16 2-30-8-32-24a30 30 0 0 1 4-26z" stroke-width="2.4"/>
    <path class="ink faint" d="M268 140c14-10 32-8 42 4" stroke-width="1.3"/>
  </g>

  <!--  RIGHT FIGURE: standing at the booth  -->
  <g>
    <path class="mask" d="M672 286h42l-6 196h-48z" stroke-width="2"/>
    <path class="mask" d="M722 286h42l8 196h-48z" stroke-width="2"/>
    <path class="mask" d="M656 482h56a6 6 0 0 1 6 6v8h-62z" stroke-width="2"/><path class="mask" d="M726 482h56a6 6 0 0 1 6 6v8h-62z" stroke-width="2"/>
    <!-- dress: shoulders to hem, one continuous silhouette -->
    <path class="mask" d="M700 168c-16 10-24 34-26 62-3 32-2 52 2 66h84c4-16 4-38 1-68-3-28-11-50-27-60-10-6-24-6-34 0z" stroke-width="2.4"/>
    <path class="ink faint" d="M700 176l-8 118M744 176l6 118" stroke-width="1"/>
    <!-- arm forward onto the table -->
    <path class="mask" d="M690 200c-22 10-40 28-48 46l16 10c10-16 26-30 42-38z" stroke-width="2"/>
    <!-- head with hair gathered up, no facial detail -->
    <path class="mask" d="M700 126a28 28 0 1 1 44 22c-6 8-16 12-26 10-14-2-22-14-22-28a28 28 0 0 1 4-4z" stroke-width="2.4"/>
    <path class="mask" d="M702 114c8-14 30-16 42-4 6 6 6 14 2 20-8-10-30-14-44-6z" stroke-width="1.8"/>
      </g>

  <!--  table, drawn over the figures' legs  -->
  <path class="mask" d="M296 262h420v12H296z" stroke-width="2.4"/>
  <g class="ink" stroke-width="1.8">
    <path d="M336 274l-26 214M336 274l26 214M320 392h34"/>
    <path d="M494 274l-24 214M494 274l24 214M478 392h34"/>
    <path d="M664 274l-24 214M664 274l24 214M648 392h34"/>
  </g>

  <!--  BOOTHS, frontmost  -->
  <g id="booth-left">
    <path class="mask" d="M344 104h116v158H344z" stroke-width="2.4"/>
    <path class="mask" d="M344 104l16-12h116l-16 12z" stroke-width="1.6"/>
    <path class="mask" d="M460 104l16-12v158l-16 12z" stroke-width="1.6"/>
    <path class="ink" d="M366 126c14-7 28 7 42 0s26 6 40 0" stroke-width="1.6"/>
    <path class="ink" d="M366 126v44" stroke-width="1.8"/>
    <g class="ink" stroke-width="1">
      <path d="M366 135c14-7 28 7 42 0s26 6 40 0M366 144c14-7 28 7 42 0s26 6 40 0M366 153c14-7 28 7 42 0s26 6 40 0M366 162c14-7 28 7 42 0s26 6 40 0"/>
    </g>
    <path class="mask" d="M366 126c8-4 16 0 24-2v20c-8 2-16-2-24 2z" stroke-width="1.3"/>
    <g class="ink" stroke-width="2.4">
      <path d="M356 194l9 26 9-26"/>
      <path d="M398 194a9 13 0 0 1 0 26 9 13 0 0 1 0-26z"/>
      <path d="M414 194h20M424 194v26"/>
      <path d="M454 194h-14v26h14M440 207h11"/>
    </g>
    <path class="ink faint" d="M352 236h100" stroke-width="1"/>
  </g>

  <g id="booth-right">
    <path class="mask" d="M534 104h116v158H534z" stroke-width="2.4"/>
    <path class="mask" d="M534 104l16-12h116l-16 12z" stroke-width="1.6"/>
    <path class="mask" d="M650 104l16-12v158l-16 12z" stroke-width="1.6"/>
    <path class="ink" d="M556 126c14-7 28 7 42 0s26 6 40 0" stroke-width="1.6"/>
    <path class="ink" d="M556 126v44" stroke-width="1.8"/>
    <g class="ink" stroke-width="1">
      <path d="M556 135c14-7 28 7 42 0s26 6 40 0M556 144c14-7 28 7 42 0s26 6 40 0M556 153c14-7 28 7 42 0s26 6 40 0M556 162c14-7 28 7 42 0s26 6 40 0"/>
    </g>
    <path class="mask" d="M556 126c8-4 16 0 24-2v20c-8 2-16-2-24 2z" stroke-width="1.3"/>
    <g class="ink" stroke-width="2.4">
      <path d="M546 194l9 26 9-26"/>
      <path d="M588 194a9 13 0 0 1 0 26 9 13 0 0 1 0-26z"/>
      <path d="M604 194h20M614 194v26"/>
      <path d="M644 194h-14v26h14M630 207h11"/>
    </g>
    <path class="ink faint" d="M542 236h100" stroke-width="1"/>
  </g>

  <!-- small screen on the table between the booths -->
  <path class="mask" d="M474 212h48v46h-48z" stroke-width="1.8"/>
  <g class="ink faint" stroke-width="0.9">
    <path d="M484 226h28M484 234h28M484 242h18"/>
  </g>

  <path class="ink faint" d="M0 498h900" stroke-width="1.4"/>
</svg>
