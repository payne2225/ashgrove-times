<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: Topsail Sound at the afternoon low tide of minus two tenths of a foot. Bared mud and oyster flats stand out of the water on either side of a narrow channel that runs away toward a low barrier island on the horizon, with marsh grass in the foreground and a channel marker piling standing well clear of the water.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor;
               stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.28; }
      .mid   { opacity: 0.55; }
    </style>
  </defs>

  <g>
    <!-- Barrier island on the horizon. Topsail is a low sand island, so it
         reads as a thin band with dune lumps, never a ridge. The flat
         horizon is what tells the eye this is the coast and not the river. -->
    <path class="mask" d="M0 214 C120 208 190 204 268 208 C330 200 372 202 420 209
                          C486 200 540 204 596 210 C664 202 720 206 790 212
                          C838 209 872 212 900 216 V236 H0 Z" stroke-width="2"/>
    <g class="ink faint" stroke-width="0.9">
      <path d="M96 216c10 6 18 12 22 18M300 212c10 6 18 12 22 18M552 214c10 6 18 12 22 18M770 218c10 6 18 12 22 18"/>
    </g>
    <!-- A few beach houses on stilts, drawn small so the island stays far. -->
    <g class="mask" stroke-width="1.4">
      <path d="M232 206h16v9h-16z"/>
      <path d="M470 204h18v10h-18z"/>
      <path d="M652 207h15v9h-15z"/>
    </g>

    <!-- Open water beyond the flats, still holding its depth at low tide. -->
    <g class="ink faint" stroke-width="1">
      <path d="M40 250c48-7 100-7 148 2M250 246c46-7 96-7 142 2M470 250c44-6 92-6 136 2M690 254c40-6 84-6 124 2"/>
      <path d="M150 268c44-6 92-6 136 2M400 264c44-6 92-6 136 2M630 270c40-6 84-6 124 2"/>
    </g>

    <!-- THE CHANNEL. It opens toward the viewer and pinches to nothing at the
         island, and that convergence is what makes flat bands read as a
         waterway seen from the marsh edge. -->
    <path class="ink" d="M0 470 C150 430 322 356 468 286" stroke-width="2.6"/>
    <path class="ink" d="M330 506 C438 434 520 356 566 288" stroke-width="2.6"/>
    <path class="ink mid" d="M468 286 C492 282 528 282 566 288" stroke-width="1.6"/>

    <!-- Moving water inside the channel: the tide is running out, so the
         riffle marks are drawn pulling seaward and crowding as they recede. -->
    <g class="ink mid" stroke-width="1.2">
      <path d="M120 456c40-14 78-22 112-24M250 420c36-13 70-20 100-22M354 384c30-11 58-17 84-19M436 348c24-9 46-14 66-15M496 318c18-7 34-11 50-12"/>
    </g>

    <!-- LEFT FLAT, out of the water. The scalloped upper edge is the wet line
         the falling tide left behind; the ticks are oyster shell. -->
    <path class="mask" d="M0 340 C90 336 168 348 236 372 C300 394 356 424 400 460
                          C428 482 442 496 450 506 H0 Z" stroke-width="2.2"/>
    <g class="ink faint" stroke-width="1">
      <path d="M0 366 C86 362 158 374 222 396 C280 416 330 444 370 476"/>
      <path d="M0 396 C78 393 144 404 202 424 C254 442 298 466 332 494"/>
    </g>
    <g class="ink mid" stroke-width="1.1">
      <path d="M56 388l6 7M104 402l6 7M158 424l6 7M212 452l6 7M84 438l6 7M140 462l6 7M46 460l6 7M196 488l6 7"/>
    </g>

    <!-- RIGHT BAR, smaller and further off, so the flats do not read as one
         symmetrical wall of mud. -->
    <path class="mask" d="M900 322 C830 320 762 332 700 356 C648 376 612 400 588 424
                          C570 442 560 462 556 506 H900 Z" stroke-width="2.2"/>
    <g class="ink faint" stroke-width="1">
      <path d="M900 350 C838 348 776 359 720 380 C674 397 640 420 618 444"/>
      <path d="M900 384 C846 382 792 392 744 410 C704 425 674 444 654 466"/>
    </g>
    <g class="ink mid" stroke-width="1.1">
      <path d="M844 372l6 7M780 392l6 7M726 418l6 7M812 414l6 7M756 448l6 7M866 424l6 7M690 462l6 7"/>
    </g>

    <!-- Channel marker piling. At this tide it stands well clear of the water,
         which is the whole point of a minus low. -->
    <g class="ink" stroke-width="2.4">
      <path d="M612 268 L606 404"/>
      <path d="M626 270 L634 404"/>
    </g>
    <path class="mask" d="M596 256 h48 v20 h-48 z" stroke-width="2"/>
    <g class="ink faint" stroke-width="1">
      <path d="M600 404c8 6 24 8 40 2"/>
    </g>

    <!-- Foreground marsh grass on the near bank, drawn as blades from a
         common root rather than scattered strokes. -->
    <g class="ink" stroke-width="1.5">
      <path d="M38 506c2-30 0-52-10-72M46 506c8-28 12-50 8-74M54 506c14-26 24-46 26-70"/>
      <path d="M118 506c0-26-4-46-14-64M126 506c8-24 10-44 6-66M134 506c14-22 22-40 24-62"/>
      <path d="M786 506c-2-28 0-48 10-68M794 506c-8-26-12-46-8-68M802 506c-14-24-22-42-24-64"/>
      <path d="M866 506c0-24 4-42 14-58M874 506c-8-22-10-40-6-60"/>
    </g>
    <g class="ink mid" stroke-width="1.1">
      <path d="M188 506c4-20 2-34-6-46M196 506c8-18 12-32 10-46M258 506c-2-18 0-32 8-44M266 506c8-16 12-30 12-42"/>
      <path d="M700 506c-2-20 0-34 8-46M708 506c8-18 12-30 12-44"/>
    </g>
  </g>
</svg>
