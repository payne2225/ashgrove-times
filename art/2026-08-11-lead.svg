<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: Topsail Sound at the afternoon low tide of minus two tenths of a foot. Bared mud and oyster flats stand out of the water on either side of a narrow channel running away toward a low barrier island on the horizon, with marsh grass in the foreground and a channel marker whose piling stands well clear of the water.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor;
               stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.28; }
      .mid   { opacity: 0.55; }
    </style>
  </defs>

  <g>
    <!-- Barrier island on the horizon. Topsail is a low sand island, so it
         reads as a thin band with dune lumps, never a ridge. The flat
         horizon is what tells the eye this is the coast and not the river. -->
    <path class="mask" d="M0 214 C120 208 190 204 268 208 C330 200 372 202 420 209
                          C486 200 540 204 596 210 C664 202 720 206 790 212
                          C838 209 872 212 900 216 V234 H0 Z" stroke-width="2"/>
    <g class="ink faint" stroke-width="0.9">
      <path d="M96 216c10 5 18 10 22 15M300 212c10 5 18 10 22 15M552 214c10 5 18 10 22 15M770 218c10 5 18 10 22 15"/>
    </g>
    <!-- A few beach houses on stilts, drawn small so the island stays far. -->
    <g class="mask" stroke-width="1.3">
      <path d="M232 205h15v9h-15z"/>
      <path d="M470 203h17v10h-17z"/>
      <path d="M652 206h14v9h-14z"/>
    </g>

    <!-- Open water still holding depth beyond the bars. -->
    <g class="ink faint" stroke-width="1">
      <path d="M40 250c48-6 100-6 148 2M250 246c46-6 96-6 142 2M470 250c44-5 92-5 136 2M690 254c40-5 84-5 124 2"/>
      <path d="M150 266c44-5 92-5 136 2M400 262c44-5 92-5 136 2M630 268c40-5 84-5 124 2"/>
    </g>

    <!-- THE CHANNEL. It opens toward the viewer and runs all the way back to
         the island, and that convergence is what makes flat bands read as a
         waterway seen from the marsh edge rather than as a wedge of ground. -->
    <path class="ink" d="M0 494 C160 452 340 366 476 268 C500 250 512 240 516 234" stroke-width="2.6"/>
    <path class="ink" d="M356 506 C446 430 512 356 544 292 C554 270 558 250 560 234" stroke-width="2.6"/>

    <!-- Water inside the channel: the tide is running out, so the marks pull
         seaward and crowd together as they recede. -->
    <g class="ink mid" stroke-width="1.2">
      <path d="M130 470c44-14 84-24 118-28M262 428c38-13 72-21 102-25M368 388c30-11 58-18 82-21M452 348c24-9 44-14 62-17M512 310c16-6 30-10 42-12M548 278c10-4 18-6 26-8"/>
    </g>

    <!-- LEFT FLAT, out of the water. Its top edge is deliberately shallow and
         scalloped: a tide flat is a nearly level sheet of mud with a ragged
         wet line, and drawing it as one smooth arc made it read as a hill. -->
    <path class="mask" d="M0 356 C56 352 92 360 132 356 C176 352 208 362 248 372
                          C292 383 320 396 352 414 C388 434 412 456 430 480
                          C440 494 446 500 450 506 H0 Z" stroke-width="2.2"/>
    <g class="ink mid" stroke-width="1.1">
      <path d="M0 372c48-4 84 4 122 2M138 378c40 4 74 14 108 26M272 414c34 14 62 30 88 50"/>
    </g>
    <g class="ink faint" stroke-width="1">
      <path d="M0 400c60-3 108 6 152 20 44 14 82 34 116 60"/>
      <path d="M0 440c52-2 96 6 136 20 38 13 70 30 100 52"/>
    </g>
    <!-- Oyster shell on the bared mud, drawn as short paired ticks. -->
    <g class="ink mid" stroke-width="1.1">
      <path d="M58 390l5 6M104 404l5 6M162 428l5 6M216 456l5 6M88 442l5 6M144 468l5 6M44 466l5 6M198 490l5 6M258 484l5 6M120 496l5 6"/>
    </g>

    <!-- RIGHT BAR, smaller and further off, so the flats do not read as one
         symmetrical pair of mounds. -->
    <path class="mask" d="M900 336 C852 334 812 342 774 350 C728 360 692 374 664 390
                          C630 410 606 432 592 456 C580 476 574 492 572 506 H900 Z" stroke-width="2.2"/>
    <g class="ink mid" stroke-width="1.1">
      <path d="M900 356c-46-2-86 6-124 16M754 382c-34 12-62 28-86 48"/>
    </g>
    <g class="ink faint" stroke-width="1">
      <path d="M900 396c-56-2-104 8-146 26-38 16-70 38-94 62"/>
      <path d="M900 440c-48-2-90 6-128 22-34 14-62 32-84 54"/>
    </g>
    <g class="ink mid" stroke-width="1.1">
      <path d="M840 380l5 6M782 402l5 6M730 428l5 6M812 424l5 6M760 456l5 6M866 428l5 6M696 468l5 6M648 492l5 6"/>
    </g>

    <!-- Channel marker on the near right lip of the channel. At a minus low
         its piling stands well clear of the water, which is the whole point
         of this tide. -->
    <g class="ink" stroke-width="2.6">
      <path d="M596 286 L590 452"/>
      <path d="M614 288 L626 452"/>
      <path d="M592 372 L620 376"/>
    </g>
    <path class="mask" d="M578 262 h54 v26 h-54 z" stroke-width="2.1"/>
    <g class="ink faint" stroke-width="1">
      <path d="M584 452c10 6 30 8 48 2"/>
    </g>

    <!-- Foreground marsh grass on the near bank, blades rising from a common
         root rather than scattered strokes. -->
    <g class="ink" stroke-width="1.5">
      <path d="M38 506c2-30 0-52-10-72M46 506c8-28 12-50 8-74M54 506c14-26 24-46 26-70"/>
      <path d="M118 506c0-26-4-46-14-64M126 506c8-24 10-44 6-66M134 506c14-22 22-40 24-62"/>
      <path d="M786 506c-2-28 0-48 10-68M794 506c-8-26-12-46-8-68M802 506c-14-24-22-42-24-64"/>
      <path d="M866 506c0-24 4-42 14-58M874 506c-8-22-10-40-6-60"/>
    </g>
    <g class="ink mid" stroke-width="1.1">
      <path d="M188 506c4-20 2-34-6-46M196 506c8-18 12-32 10-46M262 506c-2-18 0-32 8-44M270 506c8-16 12-30 12-42"/>
      <path d="M700 506c-2-20 0-34 8-46M708 506c8-18 12-30 12-44"/>
    </g>
  </g>
</svg>
