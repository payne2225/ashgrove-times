<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: four federal agents seen from behind, in dark rain jackets lettered POLICE HSI and ball caps, standing in a residential street between two black SUVs. The SUV at left has its tailgate raised; the one at right is parked nose-away with a Virginia plate. Autumn trees close the top of the frame and fallen leaves lie on the asphalt. Drawn after a Reuters photograph published by Al Jazeera of Monday's search of Rep. Ilhan Omar's home.">
