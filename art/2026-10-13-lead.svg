      .tint3 { fill: currentColor; opacity: 0.36; stroke: none; }
      .tint4 { fill: currentColor; opacity: 0.6; stroke: none; }
      .faint { opacity: 0.35; }
      .mid   { opacity: 0.6; }
      .lbl   { fill: var(--parchment, #f4f0e6); font-family: Georgia, 'Times New Roman', serif; font-weight: bold; }
    </style>
  </defs>

