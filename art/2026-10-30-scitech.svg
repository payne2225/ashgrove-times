<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch after a NASA photograph of Thursday's spacewalk outside the International Space Station: two long roll-out solar array wings run diagonally from the upper right to the lower left, their surfaces gridded with cells. A spacesuited figure, visor down and no face visible, floats against the upper wing with legs trailing toward the lower right. Below, the white boom of the Canadarm2 robotic arm, lettered Canada, reaches up from the bottom right corner to an end effector near the figure's feet. Behind everything the curve of the Earth's limb crosses the upper right, with cloud bands below it and black space above.">
  <defs><style>
    .ink  { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .body { fill: var(--parchment, #f4f0e6); stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .dark { fill: currentColor; stroke: none; }
    .faint{ opacity: 0.3; }
    .mid  { opacity: 0.6; }
    .lbl  { fill: currentColor; font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
  </style></defs>
  <g>
    <!-- Space: the corner above the Earth's limb, hatched dark. -->
    <path class="dark" d="M560 0 L900 0 L900 150 C800 92 690 44 560 0 Z" opacity="0.85"/>
    <!-- The Earth's limb and the haze band just inside it. -->
    <path class="ink" d="M560 0 C690 44 800 92 900 150" stroke-width="2"/>
    <path class="ink mid" d="M585 18 C700 60 800 108 900 170" stroke-width="1"/>
    <!-- Cloud bands across the ocean, loose and low in contrast. -->
    <g class="ink faint" stroke-width="1">
      <path d="M560 220 C600 212 640 226 690 216 C730 208 760 222 800 214"/>
      <path d="M520 300 C570 292 610 310 660 300 C700 292 740 306 790 296 C830 288 860 300 900 292"/>
      <path d="M580 380 C620 372 660 388 710 378 C750 372 790 386 840 376"/>
      <path d="M640 450 C680 442 720 456 770 446 C810 440 850 452 900 444"/>
      <path d="M700 250 C720 244 740 254 760 248"/>
      <path d="M820 330 C840 324 860 334 880 328"/>
    </g>

    <!-- Station hardware at the top left: a module end and a truss stub. -->
    <path class="body" d="M0 0 L120 0 L120 40 C110 56 60 60 0 54 Z"/>
    <path class="ink" d="M0 54 L120 40 M30 0 L30 18 M60 0 L60 22 M90 0 L90 20"/>
    <path class="body" d="M118 8 L170 8 L170 30 L118 32 Z"/>
    <path class="body" d="M70 60 L96 60 L96 86 L70 86 Z"/>
    <path class="ink faint" d="M96 73 L130 70"/>

    <!-- Upper array wing: a long parallelogram from the top edge to the left edge. -->
    <path class="body" d="M300 0 L452 0 L70 296 L0 250 Z"/>
    <!-- Its cells: lines along the wing and across it. -->
    <g class="ink faint" stroke-width="0.8">
      <path d="M338 0 L18 262 M376 0 L36 275 M414 0 L54 287"/>
      <path d="M280 16 L432 16 M258 33 L410 33 M236 50 L388 50 M214 67 L366 67 M192 84 L344 84 M170 101 L322 101 M148 118 L300 118 M126 135 L278 135 M104 152 L256 152 M82 169 L234 169 M60 186 L212 186 M38 203 L190 203 M16 220 L168 220 M0 240 L146 237 M26 262 L124 254 M52 282 L102 271"/>
    </g>
    <!-- The wing's spine and tip. -->
    <path class="ink" d="M376 0 L36 275" stroke-width="1.6"/>
    <path class="ink" d="M0 250 L70 296"/>

    <!-- Lower array wing: wider, running from the top edge to the bottom left corner. -->
    <path class="body" d="M484 0 L740 0 L200 506 L0 506 L0 440 Z"/>
    <g class="ink faint" stroke-width="0.8">
      <path d="M548 0 L50 468 M612 0 L100 490 M676 0 L150 506"/>
      <path d="M466 18 L722 18 M448 36 L704 36 M430 54 L686 54 M412 72 L668 72 M394 90 L650 90 M376 108 L632 108 M358 126 L614 126 M340 144 L596 144 M322 162 L578 162 M304 180 L560 180 M286 198 L542 198 M268 216 L524 216 M250 234 L506 234 M232 252 L488 252 M214 270 L470 270 M196 288 L452 288 M178 306 L434 306 M160 324 L416 324 M142 342 L398 342 M124 360 L380 360 M106 378 L362 378 M88 396 L344 396 M70 414 L326 414 M52 432 L308 432 M34 450 L290 450 M16 468 L272 468 M0 486 L254 486"/>
    </g>
    <path class="ink" d="M612 0 L100 490" stroke-width="1.6"/>
    <!-- A darker band of cells near the wing's upper edge, the way the photograph reads. -->
    <path class="dark faint" d="M484 0 L548 0 L50 468 L0 440 Z"/>

    <!-- The spacesuited figure against the upper wing: helmet, torso, backpack, arms, legs trailing. -->
    <!-- Backpack -->
    <path class="body" d="M212 128 C206 110 222 100 238 104 L254 112 C262 124 256 140 244 150 L224 158 C212 154 208 140 212 128 Z"/>
    <!-- Helmet -->
    <path class="body" d="M236 118 C236 100 252 90 268 92 C284 94 294 108 292 124 C290 140 276 150 262 148 C248 146 236 134 236 118 Z"/>
    <!-- Visor: the dark face plate, no face behind it. -->
    <path class="dark" d="M250 112 C254 102 270 100 282 108 C288 116 286 130 276 136 C264 140 250 130 250 112 Z" opacity="0.8"/>
    <path class="ink faint" d="M256 110 C262 104 272 104 278 108"/>
    <!-- Torso -->
    <path class="body" d="M244 148 C262 142 286 146 300 160 C312 174 316 194 308 212 C296 226 270 230 252 220 C236 210 230 190 236 170 C238 160 240 152 244 148 Z"/>
    <path class="ink faint" d="M252 176 C268 170 290 174 302 184 M250 196 C268 192 288 196 300 204"/>
    <!-- Chest controls -->
    <path class="ink" d="M262 182 L280 178 L284 190 L266 194 Z"/>
    <!-- Near arm, reaching to the wing -->
    <path class="body" d="M300 160 C318 156 334 160 346 170 C354 178 352 190 344 194 C334 196 322 188 310 184 C302 180 296 170 300 160 Z"/>
    <path class="body" d="M342 170 C352 164 362 168 364 176 C366 184 358 190 350 188 C344 186 340 178 342 170 Z"/>
    <!-- Far arm, behind the torso -->
    <path class="body" d="M240 164 C226 168 214 178 212 190 C210 200 218 206 226 204 C234 200 238 188 244 178"/>
    <!-- Legs trailing down and right, knees bent -->
    <path class="body" d="M296 214 C312 222 330 236 342 254 C350 266 346 278 336 280 C326 282 318 270 310 258 C300 246 286 234 276 226 Z"/>
    <path class="body" d="M336 254 C350 262 364 276 372 292 C376 302 370 310 362 308 C354 306 348 294 342 284 C336 274 330 264 326 258 Z"/>
    <path class="body" d="M262 224 C270 240 282 256 296 270 C304 278 300 290 290 290 C282 290 276 280 268 270 C260 258 252 246 248 236 Z"/>
    <!-- Boots -->
    <path class="body" d="M360 306 C370 304 380 312 378 322 C376 330 364 332 358 326 C352 320 354 310 360 306 Z"/>
    <path class="body" d="M286 290 C296 288 306 296 304 306 C302 314 290 316 284 310 C278 304 280 294 286 290 Z"/>
    <!-- Tether line from the suit to the wing's spine -->
    <path class="ink faint" d="M240 154 C220 170 200 196 184 226 C176 240 170 252 166 262" stroke-dasharray="3 4"/>

    <!-- The end effector at the arm's tip, boxy, just below the figure's feet. -->
    <path class="body" d="M352 346 L402 326 L430 356 L428 392 L384 412 L350 384 Z"/>
    <path class="ink" d="M384 412 L386 378 L352 346 M386 378 L428 356"/>
    <path class="ink faint" d="M362 366 L380 358 M366 380 L384 372"/>
    <path class="body" d="M398 404 C410 398 426 400 436 410 L452 424 C458 432 450 440 440 436 L418 424 C406 420 398 412 398 404 Z"/>
    <!-- A bracket joint -->
    <path class="body" d="M430 392 C442 384 458 392 460 404 C462 416 448 426 436 420 C426 414 424 400 430 392 Z"/>

    <!-- The Canadarm2 boom: a long white cylinder from the bottom right corner up to the joint. -->
    <path class="body" d="M452 400 C470 392 492 396 506 410 L900 470 L900 506 L700 506 L446 436 C434 428 436 408 452 400 Z" stroke-width="1.8"/>
    <!-- Highlight line along the top of the cylinder and a shadow line along the bottom. -->
    <path class="ink faint" d="M470 404 L890 476"/>
    <path class="ink mid" d="M452 428 L740 506"/>
    <!-- Rings on the boom -->
    <path class="ink" d="M520 414 C528 426 522 438 512 444 M600 428 C608 440 602 452 592 458 M700 446 C708 458 702 470 692 476"/>
    <!-- The lettering along the boom. -->
    <text class="lbl" font-size="30" transform="translate(560 456) rotate(10.6) skewX(-4)">Canada</text>

    <!-- Loose bits of station hardware peeking in at the bottom left corner. -->
    <path class="ink" d="M0 496 L24 490 L30 506" opacity="0.6"/>
  </g>
</svg>
