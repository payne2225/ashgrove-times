<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" role="img"
     aria-label="Sketch: a firefighter seen from behind, in a helmet and bulky turnout gear, braces a hose whose jet climbs toward the upper floors of a nine-storey apartment block at night in Kyiv. The facade is a grid of balconies and blown-out windows; smoke rolls out of the fourth and fifth floors and across the top of the frame, and a bare tree leans in from the left over a second crew working by a floodlight. Rubble and broken branches cover the ground. Drawn after an AP photograph by Evgeniy Maloletka published by France 24 of the overnight strike.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .night { fill: currentColor; opacity: 0.55; stroke: none; }
      .tint  { fill: currentColor; opacity: 0.1; stroke: none; }
      .tint2 { fill: currentColor; opacity: 0.22; stroke: none; }
      .tint3 { fill: currentColor; opacity: 0.4; stroke: none; }
      .tint4 { fill: currentColor; opacity: 0.7; stroke: none; }
      .faint { opacity: 0.3; }
      .mid   { opacity: 0.55; }
    </style>
  </defs>

  <!-- Night sky: a dark wash over the top third, lighter where the smoke carries light. -->
  <path class="night" d="M0 0 H900 V190 C760 170 640 150 540 120 C470 100 420 60 400 0 Z"/>
  <path class="tint3" d="M0 0 H400 C420 60 470 100 540 120 C640 150 760 170 900 190 V260 C700 230 500 200 300 230 C180 250 80 270 0 300 Z"/>

