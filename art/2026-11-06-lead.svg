<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pen-and-ink drawing after an NBC News photograph: the curved screen tower of the Nasdaq MarketSite in Times Square seen from low on a wet street, two broad display bands wrapping the corner of the building, office towers rising behind it, a police SUV at the curb, and the legs of pedestrians crossing in the foreground, their reflections in the puddled pavement. No face is drawn.">
