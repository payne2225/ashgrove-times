    <path class="mid" stroke-width="0.7" d="M209,158 L222,158 M209,163 L222,163"/>
    <path class="faint" stroke-width="0.8" d="M156,184 L240,184"/>

    <!-- RIGHT CLUSTER: three ships in haze, drawn lighter with distance -->
    <!-- far ship, small, furthest -->
    <path class="mid" stroke-width="1.2" d="M528,180 L531,171 L590,171 L594,180"/>
    <path class="mid" stroke-width="1.1" d="M540,171 L540,161 L556,161 L556,171"/>
    <path class="mid" stroke-width="1.0" d="M543,161 L543,155 L553,155 L553,161"/>
