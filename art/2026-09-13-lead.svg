<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sketch after a photograph of the Strait of Hormuz off Bandar Abbas: four commercial ships anchored in haze along a high horizon, a tanker alone at left and three vessels clustered at right, with two small motorboats crossing the grey water in the foreground and leaving thin wakes, the sea drawn as faint broken lines">
  <defs>
