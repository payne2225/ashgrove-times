    <path class="ink" stroke-width="1.2" d="M676,392 L676,380 L681,377 L685,380 L685,392"/>
    <path class="ink" stroke-width="1.0" d="M680.5,377 L680.5,372 M678,372 A2.5,2.5 0 1 1 683,372 A2.5,2.5 0 1 1 678,372"/>
    <path class="mid" stroke-width="1.0" d="M740,404 L790,408 M742,400 L800,402"/>
    <path class="mid" stroke-width="0.9" d="M744,412 L772,417"/>
    <path class="faint" stroke-width="0.9" d="M624,404 L600,406"/>
