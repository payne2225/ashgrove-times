<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Pen-and-ink drawing after a CBS News photograph: a queue of people drawn as contours with no faces stands along the glass front of a bank branch in Asuncion, the line receding down a sidewalk toward a vanishing point under utility poles and wires, parked cars and a motorcycle nose-in at the curb, and a street vendor's round basket of bread rolls under a cloth in the near foreground. No face is drawn and no lettering is reproduced.">
