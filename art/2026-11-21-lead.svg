<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"
     aria-label="Sketch: the wall of screens on the New York Stock Exchange floor on Friday. Three small charts along the top each slope down to the right, columns of figures run beneath them beside the labels NYA, RUT and SPX, and two heads in the foreground are turned toward the board.">
  <defs>
    <style>
      .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .mask  { fill: var(--parchment, #f4f0e6); stroke: currentColor;
               stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.3; }
      .mid   { opacity: 0.58; }
      .word  { fill: none; stroke: currentColor; stroke-width: 1.5; font-family: Georgia, 'Times New Roman', serif; }
      .hatch { fill: none; stroke: currentColor; stroke-width: 0.9; opacity: 0.35; }
    </style>
  </defs>

  <g>
    <!-- THE BOARD. One dark panel seen from below and to the left; the far edge runs off the right side of the frame. -->
    <path class="ink" d="M150 40 L1200 14 L1200 606 L150 578 Z" stroke-width="2.2"/>
    <path class="ink faint" d="M150 70 L1200 46" stroke-width="1.2"/>
    <path class="ink faint" d="M150 548 L1200 574" stroke-width="1.2"/>

    <!-- The date along the top band, as the screen printed it. -->
    <text class="word" x="520" y="60" font-size="30" letter-spacing="1">Friday November 20</text>

    <!-- THREE CHARTS. Each is a box with a day's line that starts high on the left and ends low on the right. -->
    <!-- Chart 1 -->
    <path class="ink mid" d="M200 86 L410 80 L410 176 L200 182 Z" stroke-width="1.4"/>
    <path class="ink" d="M206 118 L222 112 L238 126 L254 122 L270 134 L286 130 L302 142 L318 150 L334 146 L350 156 L366 160 L382 168 L398 172" stroke-width="2.4"/>
    <g class="hatch">
      <path d="M212 176 L212 120"/><path d="M236 176 L236 128"/><path d="M260 176 L260 128"/>
      <path d="M284 176 L284 134"/><path d="M308 176 L308 146"/><path d="M332 175 L332 148"/>
      <path d="M356 175 L356 158"/><path d="M380 174 L380 167"/>
    </g>
    <text class="word faint" x="206" y="200" font-size="14">10  11  12  1  2  3</text>

    <!-- Chart 2 -->
    <path class="ink mid" d="M470 78 L720 72 L720 168 L470 174 Z" stroke-width="1.4"/>
    <path class="ink" d="M476 96 L494 92 L512 108 L530 104 L548 120 L566 118 L584 130 L602 128 L620 140 L638 144 L656 150 L674 156 L692 158 L712 164" stroke-width="2.4"/>
    <g class="hatch">
      <path d="M484 168 L484 96"/><path d="M510 168 L510 106"/><path d="M536 168 L536 110"/>
      <path d="M562 167 L562 118"/><path d="M588 167 L588 130"/><path d="M614 166 L614 136"/>
      <path d="M640 166 L640 146"/><path d="M666 165 L666 152"/><path d="M692 165 L692 158"/>
    </g>
    <text class="word faint" x="478" y="192" font-size="14">10  11  12  1  2  3</text>

    <!-- Chart 3 -->
    <path class="ink mid" d="M790 70 L1080 62 L1080 160 L790 168 Z" stroke-width="1.4"/>
    <path class="ink" d="M796 84 L816 90 L836 100 L856 96 L876 110 L896 108 L916 122 L936 118 L956 130 L976 136 L996 140 L1016 148 L1036 150 L1056 154 L1072 158" stroke-width="2.4"/>
    <g class="hatch">
      <path d="M806 162 L806 88"/><path d="M834 161 L834 100"/><path d="M862 161 L862 100"/>
      <path d="M890 160 L890 110"/><path d="M918 160 L918 122"/><path d="M946 159 L946 124"/>
      <path d="M974 159 L974 136"/><path d="M1002 158 L1002 142"/><path d="M1030 158 L1030 150"/>
      <path d="M1058 157 L1058 155"/>
    </g>
    <text class="word faint" x="800" y="186" font-size="14">10  11  12  1  2  3</text>
    <text class="word faint" x="1010" y="56" font-size="16">NYSE</text>

    <!-- THE INDEX NAMES, large, as they sit under their charts. -->
    <text class="word" x="196" y="246" font-size="40" letter-spacing="2">NYA</text>
    <text class="word" x="482" y="238" font-size="40" letter-spacing="2">RUT</text>
    <text class="word" x="844" y="232" font-size="40" letter-spacing="2">SPX</text>

    <!-- The closing figures beside each name, drawn as a run of digits. -->
    <text class="word mid" x="300" y="246" font-size="22">22,720.11</text>
    <text class="word mid" x="586" y="238" font-size="22">2,586.60</text>
    <text class="word mid" x="950" y="232" font-size="22">6,927.43</text>

    <!-- ROWS OF FIGURES. Each row is a label dash, a value dash and a change dash, fading toward the bottom of the board. -->
    <g class="ink mid" stroke-width="2">
      <path d="M196 290 H250"/><path d="M300 290 H372"/><path d="M400 288 H440"/>
      <path d="M196 318 H256"/><path d="M300 318 H380"/><path d="M400 316 H446"/>
      <path d="M196 346 H244"/><path d="M300 346 H376"/><path d="M400 344 H438"/>
      <path d="M196 374 H262"/><path d="M300 374 H384"/><path d="M400 372 H450"/>
      <path d="M196 402 H248"/><path d="M300 402 H378"/><path d="M400 400 H440"/>
      <path d="M196 430 H258"/><path d="M300 430 H386"/><path d="M400 428 H448"/>
      <path d="M196 458 H250"/><path d="M300 458 H374"/><path d="M400 456 H436"/>
    </g>
    <g class="ink mid" stroke-width="2">
      <path d="M482 284 H540"/><path d="M590 284 H670"/><path d="M700 282 H744"/>
      <path d="M482 312 H546"/><path d="M590 312 H676"/><path d="M700 310 H750"/>
      <path d="M482 340 H534"/><path d="M590 340 H672"/><path d="M700 338 H742"/>
      <path d="M482 368 H552"/><path d="M590 368 H680"/><path d="M700 366 H754"/>
      <path d="M482 396 H538"/><path d="M590 396 H674"/><path d="M700 394 H744"/>
      <path d="M482 424 H548"/><path d="M590 424 H682"/><path d="M700 422 H752"/>
      <path d="M482 452 H540"/><path d="M590 452 H670"/><path d="M700 450 H740"/>
    </g>
    <g class="ink mid" stroke-width="2">
      <path d="M844 278 H910"/><path d="M960 278 H1046"/><path d="M1080 276 H1130"/>
      <path d="M844 306 H916"/><path d="M960 306 H1052"/><path d="M1080 304 H1136"/>
      <path d="M844 334 H904"/><path d="M960 334 H1048"/><path d="M1080 332 H1128"/>
      <path d="M844 362 H922"/><path d="M960 362 H1056"/><path d="M1080 360 H1140"/>
      <path d="M844 390 H908"/><path d="M960 390 H1050"/><path d="M1080 388 H1130"/>
      <path d="M844 418 H918"/><path d="M960 418 H1058"/><path d="M1080 416 H1138"/>
      <path d="M844 446 H910"/><path d="M960 446 H1046"/><path d="M1080 444 H1126"/>
    </g>
    <!-- A few labels a reader of the photograph could make out. -->
    <text class="word faint" x="482" y="292" font-size="15">DXY</text>
    <text class="word faint" x="482" y="376" font-size="15">FANG</text>
    <text class="word faint" x="844" y="370" font-size="15">ICE 400</text>
    <text class="word faint" x="844" y="426" font-size="15">WTI</text>
    <text class="word faint" x="844" y="454" font-size="15">GOLD</text>

    <!-- THE CRAWL along the bottom of the board. -->
    <path class="ink mid" d="M150 500 L1200 522" stroke-width="1.2"/>
    <text class="word mid" x="240" y="540" font-size="26" letter-spacing="1">Tech Upgrades Are Causing Outages</text>
  </g>

  <!-- THE TWO HEADS. Contours only, no features; they stand between the viewer and the board. -->
  <g>
    <!-- Left: a head seen from behind and slightly to the side, cut by the bottom and left edges. -->
    <path class="mask" d="M0 660 L0 360 C10 300 60 262 120 258 C190 254 240 300 246 370 C250 420 236 470 206 500 C190 516 176 532 172 556 L176 660 Z" stroke-width="2.2"/>
    <path class="ink mid" d="M70 290 C110 268 170 272 210 304" stroke-width="1.4"/>
    <path class="ink faint" d="M236 400 C226 430 212 456 194 478" stroke-width="1.2"/>
    <path class="ink faint" d="M120 540 C150 560 168 600 174 660" stroke-width="1.2"/>

    <!-- Right: the back of a head on a neck, and a shoulder in a jacket sloping away, cut by the right edge. -->
    <path class="mask" d="M1200 660 L1200 126 C1160 104 1104 118 1074 160 C1044 202 1050 264 1090 300 C1104 312 1114 326 1116 344 C1118 362 1126 372 1140 378 L1200 390 Z" stroke-width="2.2"/>
    <path class="mask" d="M1200 660 L1200 384 C1150 374 1090 378 1040 404 C994 428 968 486 962 560 C958 596 960 630 964 660 Z" stroke-width="2.2"/>
    <path class="ink mid" d="M1090 176 C1116 146 1156 138 1196 146" stroke-width="1.4"/>
    <path class="ink faint" d="M1150 230 C1162 262 1158 294 1140 320" stroke-width="1.2"/>
    <path class="ink faint" d="M1010 480 C1040 448 1090 428 1150 424" stroke-width="1.2"/>
    <path class="ink faint" d="M990 600 C1020 556 1070 530 1130 524" stroke-width="1.2"/>
  </g>
</svg>
