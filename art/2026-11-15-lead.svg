<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="A Starship upper stage, nose up and engines lit, hangs just above the open catch arms near the top of a tall steel lattice launch tower at Starbase, Texas, under a flat grey sky. The exhaust plume trails down past the tower, a second shorter arm juts from the tower lower down, the tower stands on a broad concrete base behind a low line of scrub along the shore, grey water fills the foreground and a scatter of birds crosses the sky at left. No people are drawn.">
<title>SpaceX's Starship descending onto its launch tower's catch arms at Starbase, from an Al Jazeera photograph</title>
