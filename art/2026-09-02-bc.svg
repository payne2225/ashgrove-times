<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"
     role="img"
     aria-label="Aerial view of a forested shoreline on Williston Reservoir with a small floating island of standing trees drifting just offshore on calm water">
  <!-- Drawn after viewing a CKPG Today aerial photograph; original line work, not a trace. -->
  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Shoreline: enters top centre, bulges toward the island mid-frame, recedes to bottom -->
    <path stroke-width="2.2" d="M 452 0
      C 470 40, 488 78, 496 118
      C 504 158, 520 186, 548 208
      C 576 230, 590 246, 586 262
      C 582 278, 560 284, 540 296
      C 520 308, 512 330, 522 356
      C 532 382, 540 410, 530 440
      C 522 464, 505 484, 492 500" />

    <!-- Waterline shadow along the shore -->
    <path stroke-width="0.8" opacity="0.5" d="M 458 12
      C 474 50, 492 86, 500 122
      C 508 156, 524 188, 552 212
      C 578 234, 594 248, 590 264" />
    <path stroke-width="0.8" opacity="0.5" d="M 546 300
      C 528 312, 520 332, 528 356
      C 536 382, 544 412, 534 442" />

    <!-- Forest canopy on the land side: contour masses, denser toward the waterline -->
    <path stroke-width="1.1" d="M 430 18 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1" />
    <path stroke-width="1.1" d="M 380 46 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0" />
    <path stroke-width="1.1" d="M 330 84 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0 q 8 -9 15 1" />
    <path stroke-width="1.1" d="M 282 128 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0" />
    <path stroke-width="1.1" d="M 238 176 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0 q 8 -9 15 1" />
    <path stroke-width="1.1" d="M 196 228 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0" />
    <path stroke-width="1.1" d="M 160 282 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0 q 8 -9 15 1" />
    <path stroke-width="1.1" d="M 130 338 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0" />
    <path stroke-width="1.1" d="M 106 394 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1 q 8 -9 15 0 q 8 -9 15 1" />
    <path stroke-width="1.1" d="M 88 448 q 8 -10 16 0 q 8 -10 15 0 q 9 -9 16 1" />

    <!-- Conifer spikes along the immediate shoreline, read against the water -->
    <path stroke-width="1.3" d="M 470 96 l 4 -18 l 4 18 M 486 132 l 4 -20 l 4 20 M 502 168 l 4 -18 l 4 18" />
    <path stroke-width="1.3" d="M 524 196 l 4 -20 l 4 20 M 548 218 l 4 -18 l 4 18 M 566 240 l 4 -20 l 4 20" />
    <path stroke-width="1.3" d="M 552 284 l 4 -18 l 4 18 M 532 306 l 4 -20 l 4 20 M 516 336 l 4 -18 l 4 18" />
    <path stroke-width="1.3" d="M 518 374 l 4 -20 l 4 20 M 526 408 l 4 -18 l 4 18 M 516 442 l 4 -20 l 4 20" />
    <path stroke-width="1.3" d="M 452 44 l 4 -18 l 4 18 M 462 70 l 4 -18 l 4 18" />

    <!-- Interior canopy texture, lighter with distance from the water -->
    <path stroke-width="0.8" opacity="0.7" d="M 320 30 q 6 -7 12 0 M 260 60 q 6 -7 12 0 M 210 100 q 6 -7 12 0 M 350 60 q 6 -7 12 0" />
    <path stroke-width="0.8" opacity="0.7" d="M 160 150 q 6 -7 12 0 M 120 210 q 6 -7 12 0 M 90 270 q 6 -7 12 0 M 200 140 q 6 -7 12 0" />
    <path stroke-width="0.8" opacity="0.7" d="M 60 330 q 6 -7 12 0 M 40 390 q 6 -7 12 0 M 30 450 q 6 -7 12 0 M 130 260 q 6 -7 12 0" />
    <path stroke-width="0.8" opacity="0.6" d="M 20 40 q 6 -7 12 0 M 60 90 q 6 -7 12 0 M 110 50 q 6 -7 12 0 M 170 20 q 6 -7 12 0" />
    <path stroke-width="0.8" opacity="0.6" d="M 20 140 q 6 -7 12 0 M 60 190 q 6 -7 12 0 M 20 240 q 6 -7 12 0" />

    <!-- The floating island: a raft of standing trees clear of the point -->
    <path stroke-width="2" d="M 636 296
      C 646 286, 672 282, 692 288
      C 712 294, 718 306, 708 316
      C 696 326, 664 328, 648 320
      C 634 314, 630 304, 636 296 Z" />
    <!-- Trees standing on the mat -->
    <path stroke-width="1.4" d="M 648 300 l 4 -22 l 4 22 M 660 294 l 4 -26 l 4 26 M 674 292 l 4 -24 l 4 24" />
    <path stroke-width="1.4" d="M 686 296 l 4 -22 l 4 22 M 696 302 l 3 -18 l 3 18 M 668 306 l 3 -16 l 3 16" />
    <path stroke-width="1.2" d="M 656 310 l 3 -14 l 3 14 M 682 310 l 3 -14 l 3 14" />
    <!-- Reflection beneath the mat -->
    <path stroke-width="0.8" opacity="0.45" d="M 640 330 q 30 8 66 0" />
    <path stroke-width="0.6" opacity="0.3" d="M 650 340 q 22 6 46 0" />

    <!-- Still water: sparse long ripples, widening toward open water -->
    <path stroke-width="0.6" opacity="0.35" d="M 620 120 q 60 6 150 2" />
    <path stroke-width="0.6" opacity="0.35" d="M 640 200 q 70 6 150 2" />
    <path stroke-width="0.6" opacity="0.35" d="M 620 400 q 80 6 170 2" />
    <path stroke-width="0.6" opacity="0.3" d="M 600 460 q 80 6 180 2" />
    <path stroke-width="0.6" opacity="0.3" d="M 700 60 q 50 4 90 2" />
    <path stroke-width="0.6" opacity="0.3" d="M 740 340 q 30 4 55 2" />
  </g>
</svg>
