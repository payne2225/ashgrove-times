<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img"
     aria-label="Line drawing of the Rend Trail near Minden: a plank trestle deck strewn with leaves runs between two converging wooden rail fences toward a wall of trees, with a rock face rising on the left and tall trunks on the right."
     fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

  <!-- deck: plank edges converging to a vanishing point near (395,150) -->
  <path d="M60 420 L370 165" stroke-width="2.5"/>
  <path d="M700 420 L420 165" stroke-width="2.5"/>
  <path d="M370 165 Q395 158 420 165" stroke-width="1.5"/>

