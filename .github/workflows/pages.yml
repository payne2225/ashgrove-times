# The daily routine commits the rendered edition into site/ and pushes; this
# publishes whatever landed there. Nothing is BUILT here on purpose - the paper
# is plain self-contained HTML, so a build step could only add ways for the
# 7 AM push to fail.
#
# What IS here, since 2026-09-02, is the test suite as a gate in front of the
# deploy. validate_edition.py is every rule the paper has and it had none
# behind it; a red validator now blocks a deploy rather than shipping quietly.
# The tests are fully offline (their data files live in tests/fixtures/), so
# the only way they fail is a real regression, never a flaky source.
#
# Triggers on every push to main, not only site/**, so a change to the
# validator or the poster is tested even when no page moved. The deploy that
# follows a docs-only push republishes the same site/ - idempotent and cheap.

name: Publish the paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a cancelled deploy
# can leave the site serving a half-published edition.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Test
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if site/ is empty
        run: |
          test -f site/index.html || {
            echo "site/index.html missing - refusing to publish an empty paper"
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
