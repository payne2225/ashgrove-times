# The daily routine commits the rendered edition into site/ and pushes; this
# publishes whatever landed there. Nothing is built here on purpose - the paper
# is plain self-contained HTML, so a build step could only add ways for the
# 7 AM push to fail.

name: Publish the paper

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a cancelled deploy
# can leave the site serving a half-published edition.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if site/ is empty
        run: |
          test -f site/index.html || {
            echo "site/index.html missing - refusing to publish an empty paper"
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
